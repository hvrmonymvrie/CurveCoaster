<html lang="en">
<head>
<meta charset="utf-8">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Hands-on synthetic division: compact, paper-like workspace */
.synth-workshop{display:flex;flex-direction:column;gap:12px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.workshop-label{font-size:.78rem;letter-spacing:.12em;font-weight:700;color:var(--sky)}
.workshop-help{font-size:1rem;line-height:1.6;max-width:65ch;color:var(--ink)}
.synth-board{position:relative;display:inline-block;max-width:100%;vertical-align:top}
.synth-board table{position:relative;z-index:2}
.synth-overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:hidden;z-index:3}
.synth-link{stroke:color-mix(in srgb,var(--good) 84%, white 16%);stroke-width:2.5;opacity:.75;fill:none;stroke-linecap:round;stroke-dasharray:8 7;animation:dashFlow 1.1s linear infinite;filter:drop-shadow(0 0 3px color-mix(in srgb,var(--good) 70%, white 30%))}
.synth-link.add{stroke:color-mix(in srgb,var(--gold) 86%, white 14%);opacity:.75;filter:drop-shadow(0 0 3px color-mix(in srgb,var(--gold) 75%, white 25%))}
.synth-pulse-source{border-radius:10px;box-shadow:0 0 0 2px color-mix(in srgb,var(--good) 75%, white 25%),0 0 18px color-mix(in srgb,var(--good) 55%, white 45%);background:color-mix(in srgb,var(--good-soft) 70%, transparent 30%);animation:sourcePulse 1s ease-in-out infinite}
.synth-pulse-target{border-radius:10px;box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--gold) 80%, white 20%),0 0 16px color-mix(in srgb,var(--gold) 55%, white 45%);background:color-mix(in srgb,var(--gold) 14%, transparent 86%);animation:targetPulse 1s ease-in-out infinite}
.synth-active{border-spacing:0;font-size:clamp(.95rem,2.8vw,1.1rem);}
.synth-active td{min-width:clamp(49px,10vw,78px);height:54px;position:relative;transition:box-shadow .2s ease,background .2s ease}
.synth-active .drag-source{background:var(--sky-soft);border:2px solid var(--sky);border-radius:10px;cursor:grab;touch-action:auto}
.synth-active td.act{background:var(--sky-soft);border-radius:8px;box-shadow:inset 0 0 0 2px var(--sky)}
.synth-active .drop-zone{cursor:pointer;border:2px dashed var(--sky);border-radius:8px}
.drop-here{font-size:.75rem;font-weight:500;color:var(--muted)}
.synth-cell-input{display:block;width:100%;min-width:0;height:44px;box-sizing:border-box;padding:4px;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-weight:700;text-align:center}
.synth-cell-input:focus{outline:2px solid var(--sky);outline-offset:-3px;border-radius:6px}
.synth-workshop .say{font-size:1rem;line-height:1.5;min-height:2.7em}
@keyframes sourcePulse{0%,100%{opacity:1}50%{opacity:.85}}
@keyframes targetPulse{0%,100%{opacity:1}50%{opacity:.85}}
@keyframes dashFlow{from{stroke-dashoffset:18}to{stroke-dashoffset:0}}
@media(max-width:520px){.synth-workshop{padding:10px}.synth-active td{min-width:48px;padding:0 3px}}

/* Stable division layout: guides and glow never alter scroll dimensions. */
.synth.synth-active{table-layout:fixed;width:auto;max-width:100%;border-spacing:0}
.synth.synth-active td{width:clamp(48px,8vw,72px);min-width:clamp(48px,8vw,72px);max-width:clamp(48px,8vw,72px);box-sizing:border-box;padding:0 4px}
.synth.synth-active .synth-cell-input{min-width:0;width:100%}
@media(max-width:420px){.synth.synth-active td{width:44px;min-width:44px;max-width:44px;padding:0 2px}.synth-workshop{padding:10px 8px}}@media(max-width:360px){.synth.synth-active td{width:38px;min-width:38px;max-width:38px;padding:0 1px}.synth-active{font-size:.95rem}.synth-workshop{padding:8px 4px}}
</style>
<title>Curve Coaster</title>
<meta name="version" content="Curve Coaster v2.2 visual and instructional audit">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Lexend:wght@400;500;600;700&display=swap">
<style>
/* Layout: one centered column. The map is a vertical coaster route of five stations; each level swaps Learn / Play / Challenge panels around a live track canvas. */
:root{
  --bg:#EAF1F5; --surface:#FFFFFF; --surface-2:#F3F7FA; --ink:#14203A; --muted:#55658A; --line:#D3DDE7;
  --track:#E14B35; --track-ink:#FFFFFF; --ground:#13906A; --gold:#DE960A; --sky:#2C67CF; --sky-soft:#DDE8FB;
  --good:#12805B; --good-soft:#DDF3EA; --bad:#BF3627; --bad-soft:#FBE4E0;
  --display:"Bungee","Arial Black",Impact,sans-serif;
  --body:"Lexend",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1525; --surface:#172238; --surface-2:#1C2943; --ink:#E8EEF8; --muted:#9DABC6; --line:#2A3955;
    --track:#FF6A52; --track-ink:#1A0F0C; --ground:#34C48F; --gold:#FFBE45; --sky:#82ABFF; --sky-soft:#22355C;
    --good:#4AD2A0; --good-soft:#163A30; --bad:#FF8A7C; --bad-soft:#41221F; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1525; --surface:#172238; --surface-2:#1C2943; --ink:#E8EEF8; --muted:#9DABC6; --line:#2A3955;
  --track:#FF6A52; --track-ink:#1A0F0C; --ground:#34C48F; --gold:#FFBE45; --sky:#82ABFF; --sky-soft:#22355C;
  --good:#4AD2A0; --good-soft:#163A30; --bad:#FF8A7C; --bad-soft:#41221F; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 56px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
p{margin:0}
sup{font-size:.68em;line-height:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{font-family:var(--display);font-size:clamp(1.25rem,4.5vw,1.75rem);background:none;border:0;padding:0;cursor:pointer;line-height:1;letter-spacing:.01em}
.logo span{color:var(--track)}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;gap:6px;align-items:baseline;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.88rem;font-variant-numeric:tabular-nums;color:var(--muted)}
.pill b{color:var(--ink);font-weight:700}
.pill.hot b{color:var(--track)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:clamp(16px,3vw,24px);display:flex;flex-direction:column;gap:14px;min-width:0}
.eyebrow{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(1.5rem,5vw,2.3rem);line-height:1.1}
.hero p{max-width:62ch;color:var(--muted)}
.sec{font-family:var(--display);font-weight:400;font-size:1.15rem}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}

.stage{position:relative;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
.stage canvas{display:block;width:100%}
.stage canvas.tappable{cursor:crosshair}
.eq{font-size:clamp(1.05rem,3.4vw,1.35rem);font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.01em;overflow-wrap:anywhere}
.eq.small{font-size:1rem}

.btn{border:0;border-radius:10px;padding:10px 18px;font-weight:600;cursor:pointer;background:var(--track);color:var(--track-ink);transition:transform .12s}
.btn:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{padding:6px 12px;font-size:.88rem}

/* route map */
.route{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;position:relative}
.route::before{content:"";position:absolute;left:27px;top:24px;bottom:24px;width:4px;border-radius:2px;
  background:repeating-linear-gradient(var(--track) 0 10px,transparent 10px 16px);opacity:.55}
.stop{position:relative;display:grid;grid-template-columns:58px 1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px 14px 0}
.stop.next{border-color:var(--track);box-shadow:0 0 0 3px color-mix(in srgb,var(--track) 18%,transparent)}
.badge{justify-self:center;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:1.1rem;background:var(--surface-2);border:3px solid var(--line);z-index:1}
.stop.done .badge{border-color:var(--ground);color:var(--ground)}
.stop.next .badge{border-color:var(--track);color:var(--track)}
.stop h3{font-size:1.05rem;font-weight:700}
.stop .meta{font-size:.88rem;color:var(--muted)}
.stars{color:var(--gold);letter-spacing:2px;font-size:.95rem}
.stars i{font-style:normal;color:var(--line)}
@media (max-width:520px){ .stop{grid-template-columns:58px 1fr} .stop .btn{grid-column:2;justify-self:start} }

.playbook{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:8px}
.playbook li{padding-left:4px}
.playbook b{font-weight:600}

/* level */
.lvl-head{display:flex;flex-direction:column;gap:6px}
.back{background:none;border:0;padding:0;color:var(--muted);cursor:pointer;font-size:.92rem;align-self:flex-start}
.lvl-head h1{font-family:var(--display);font-weight:400;font-size:clamp(1.4rem,5vw,2rem)}
.tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:5px}
.tab{flex:1;border:0;background:transparent;border-radius:8px;padding:9px 6px;font-weight:600;cursor:pointer;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--surface)}

.steps-dots{display:flex;gap:6px}
.steps-dots span{width:26px;height:6px;border-radius:3px;background:var(--line)}
.steps-dots span.on{background:var(--track)}
.lesson h2{font-size:1.3rem;font-weight:700}
.lesson .body{display:flex;flex-direction:column;gap:10px;max-width:66ch}
.ex{display:flex;flex-direction:column;gap:4px;background:var(--surface-2);border-left:4px solid var(--gold);border-radius:6px;padding:10px 14px;font-variant-numeric:tabular-nums}
.tip{background:var(--sky-soft);border-radius:10px;padding:10px 14px}
.cap{font-size:.88rem;color:var(--muted)}
.ride-wait{min-height:230px;display:grid;place-items:center;text-align:center;color:var(--muted);padding:24px;border-style:dashed}

.quiz{display:flex;flex-direction:column;gap:10px;border-top:1px dashed var(--line);padding-top:14px}
.quiz .q{font-weight:600}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.choice{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;text-align:left;cursor:pointer;font-variant-numeric:tabular-nums}
.choice:hover:not(:disabled){border-color:var(--sky)}
.choice.sel{border-color:var(--sky);background:var(--sky-soft)}
.choice.right{border-color:var(--good);background:var(--good-soft)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.choice:disabled{cursor:default}
.fb{border-radius:10px;padding:10px 14px;display:none}
.fb.ok{display:block;background:var(--good-soft);color:var(--ink);border-left:4px solid var(--good)}
.fb.no{display:block;background:var(--bad-soft);color:var(--ink);border-left:4px solid var(--bad)}
.fb.info{display:block;background:var(--sky-soft);border-left:4px solid var(--sky)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* builder */
.builder{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.stepper{display:flex;align-items:center;gap:2px}
.stepper button,.seg button,.x{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700}
.stepper output{min-width:34px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;gap:3px;align-items:center}
.seg .lab{font-size:.78rem;color:var(--muted);margin-right:3px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.seg.wide button{width:auto;padding:0 12px}
.x{color:var(--bad)}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.readout div{background:var(--surface-2);border-radius:10px;padding:8px 12px;min-width:0}
.readout small{display:block;font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.readout b{font-variant-numeric:tabular-nums}

.pips{display:flex;gap:6px}
.pips span{flex:1;height:8px;border-radius:4px;background:var(--line)}
.pips span.done{background:var(--ground)}
.pips span.now{background:var(--gold)}
.mrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--surface-2);border-radius:12px;padding:10px 12px}
.mrow .eq{font-size:1.05rem}
.ends{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.ends .choice{display:flex;gap:10px;align-items:center}
.ends svg{flex:none;width:44px;height:30px}
.ends svg path{fill:none;stroke:var(--track);stroke-width:3;stroke-linecap:round}
.shapes{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.shapes div{display:flex;gap:10px;align-items:center;background:var(--surface-2);border-radius:10px;padding:8px 10px;font-size:.92rem}
.shapes svg{flex:none;width:44px;height:30px}
.shapes svg path{fill:none;stroke:var(--track);stroke-width:3;stroke-linecap:round}
.win{align-items:flex-start}
.win h2{font-family:var(--display);font-weight:400;font-size:1.6rem;color:var(--track)}
.bigstars{font-size:2rem;color:var(--gold);letter-spacing:4px}
.bigstars i{font-style:normal;color:var(--line)}
.synth-wrap{overflow-x:hidden;overflow-y:hidden;max-width:100%}
.synth{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:1.1rem;font-weight:600}
.synth td{min-width:3.1rem;height:2.6rem;text-align:center;padding:0 6px}
.synth td.box{border:2px solid var(--ink);border-radius:6px;min-width:2.6rem}
.synth tr.bot td{border-top:2px solid var(--ink)}
.synth tr.bot td:first-child{border-top:0}
.synth td.rem{outline:2px solid var(--gold);outline-offset:-4px;border-radius:6px}
.synth td.act{background:var(--sky-soft);box-shadow:inset 0 0 0 2px var(--sky);border-radius:6px}
.say{min-height:1.6em}
.num{font:inherit;font-size:1.1rem;width:8rem;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.35;margin:0 .15em}
.frac>span:first-child{border-bottom:2px solid currentColor;padding:0 .3em 2px}
.frac>span:last-child{padding:2px .3em 0}
.sechead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:1rem;font-weight:700;margin:8px 0 0}
.sechead span{font-family:var(--display);font-weight:400;color:var(--track);font-size:.95rem}
.cands{gap:6px}
.cands .choice{min-width:3.2rem;text-align:center;padding:8px 10px}
.pb-group{display:flex;flex-direction:column;gap:8px}
.pb-group h3{font-size:.95rem}
@media (prefers-reduced-motion: reduce){ .btn,.shake{transition:none;animation:none} }
</style>
<style id="ride-learn-clarity">
/* Quiet, readable instructional hierarchy. Match the game's coral and gold accents. */
.lesson .body{max-width:none;display:flex;flex-direction:column;gap:14px;background:var(--surface-2);color:var(--ink);border:1px solid var(--line);border-left:4px solid var(--track);border-radius:12px;padding:clamp(16px,2.5vw,24px);font-family:var(--body);font-size:clamp(1rem,2vw,1.13rem);font-weight:400;line-height:1.65}
.lesson .body p,.lesson .body li,.lesson .body span{color:var(--ink)}
.lesson .body::before{content:'LEARN THE IDEA';display:block;color:var(--track);font-size:.78rem;font-weight:700;letter-spacing:.08em;line-height:1.2}
.lesson>h2{font-family:var(--body);font-size:clamp(1.5rem,3vw,1.9rem);font-weight:700;line-height:1.3}
.lesson .body .ex{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:9px;padding:16px;font-size:1rem;line-height:1.6}
.lesson .body .ex span{color:var(--ink)}
.lesson .quiz{margin-top:12px;padding:clamp(14px,2vw,20px);background:var(--surface-2);border:1px solid var(--line);border-radius:12px}
.lesson .quiz .q{font-size:clamp(1.05rem,2vw,1.19rem);font-weight:600;line-height:1.5}
.math-focus{display:inline-block;font-weight:700;color:var(--track)!important}
.math-table{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;text-align:center;margin-top:8px}
.math-table .cell{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:10px 3px;font-variant-numeric:tabular-nums;font-size:clamp(.87rem,2vw,1.08rem)}
.math-table .head{background:var(--surface-2);font-size:.84rem;font-weight:600;color:var(--muted)}
.math-table .blank{border:1px dashed var(--gold);background:color-mix(in srgb,var(--gold) 12%,var(--surface));color:var(--ink);font-weight:700}
.studio-explain b,.studio-explain strong,.lesson .body b,.lesson .body strong,.studio-worked b,.studio-worked strong{color:color-mix(in srgb,var(--gold) 84%, white 16%);font-weight:800}
.studio-teaching-panel .teaching-label,.lesson .body::before{color:color-mix(in srgb,var(--track) 85%, white 15%)}
.lesson-note{font-size:.95rem;color:var(--muted);line-height:1.55}
.lesson .body .lesson-note{color:var(--muted)}
</style>
<style id="missions-v2">
/* ===== Learning Missions v2: calm, theme-aware, responsive ===== */
:root{--accent-text:#8A5600;--coef:#8A5600;--expc:#2153B0;--shade:#12805B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--accent-text:#FFC95E;--coef:#FFC95E;--expc:#9CBEFF;--shade:#4AD2A0}}
:root[data-theme="dark"]{--accent-text:#FFC95E;--coef:#FFC95E;--expc:#9CBEFF;--shade:#4AD2A0}
.mission{max-width:860px}
.m-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(16px,3vw,26px);display:flex;flex-direction:column;gap:16px;min-width:0}
.m-title{font-family:var(--body);font-size:clamp(1.3rem,3.4vw,1.65rem);font-weight:700;line-height:1.3}
.m-progress{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.m-level{font-size:.8rem;font-weight:600;border-radius:999px;padding:3px 10px;border:1px solid var(--line);color:var(--muted)}
.m-level.m-guided{border-color:var(--ground);color:var(--ground)}
.m-level.m-faded{border-color:var(--gold);color:var(--accent-text)}
.m-level.m-solo{border-color:var(--sky);color:var(--sky)}
.m-figure{margin:0;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:clamp(12px,2.6vw,20px);display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0;overflow:hidden}
.m-figcap{font-size:.92rem;color:var(--muted);text-align:center;max-width:62ch;line-height:1.5}
.m-explain{display:flex;flex-direction:column;gap:10px;font-size:clamp(1rem,2.1vw,1.1rem);line-height:1.7;max-width:68ch;font-weight:400}
.key{color:var(--accent-text);font-weight:600}
.m-words{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:8px;margin:0}

<body>

<div class="wrap">
  <header class="top">
    <button class="logo" id="home" aria-label="Back to the route map">CURVE <span>COASTER</span></button>
    <div class="stats"><span class="pill">XP <b id="xp">0</b></span><span class="pill hot">Streak <b id="streak">0</b></span><span class="pill">Best <b id="best">0</b></span></div>
  </header>
  <main id="app"></main>
</div>

<script>
/* ---------- helpers ---------- */
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const MINUS = '−';
const N = n => (n < 0 ? MINUS + Math.abs(n) : String(n));
const rint = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
// keep short expressions such as (x − c) on one line: glue binary operators to their neighbours
const nbOps = t => String(t).replace(/ ([=−+÷×<>≤≥]) /g, '&nbsp;$1&nbsp;');
const shuffle = arr => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sup = n => (n > 1 ? `<sup>${n}</sup>` : '');
const fmtFactor = (r, m = 1) => (r === 0 ? 'x' : r > 0 ? `(x ${MINUS} ${r})` : `(x + ${-r})`) + sup(m);
const fmtCoef = a => (a === 1 ? '' : a === -1 ? MINUS : N(a));
const sortRoots = roots => [...roots].sort((p, q) => (p.r === 0 ? -1 : q.r === 0 ? 1 : p.r - q.r));
const fmtPoly = (a, roots) => 'f(x) = ' + fmtCoef(a) + sortRoots(roots).map(o => fmtFactor(o.r, o.m)).join('');
const fmtPower = (a, n) => fmtCoef(a) + 'x' + sup(n);
const degree = roots => roots.reduce((s, o) => s + o.m, 0);
const polyFn = (a, roots) => x => a * roots.reduce((p, o) => p * Math.pow(x - o.r, o.m), 1);
const listJoin = arr => arr.length < 2 ? arr.join('') : arr.length === 2 ? arr.join(' and ') : arr.slice(0, -1).join(', ') + ', and ' + arr[arr.length - 1];
const R = arr => arr.map(([r, m]) => ({ r, m }));
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const curveOf = (a, roots, extra = {}) => Object.assign({ fn: polyFn(a, roots), zeros: roots.map(o => o.r), style: 'main' }, extra);
const yInt = (a, roots) => a * roots.reduce((p, o) => p * Math.pow(-o.r, o.m), 1);

function genRoots(n, o = {}) {
  const lo = o.lo ?? -5, hi = o.hi ?? 5, gap = o.gap ?? 2, ms = o.mults ?? [1];
  for (let t = 0; t < 800; t++) {
    const vals = Array.from({ length: n }, () => rint(lo, hi)).sort((a, b) => a - b);
    let ok = vals.every((v, i) => i === 0 || v - vals[i - 1] >= gap);
    if (o.noZero && vals.includes(0)) ok = false;
    if (o.needZero && !vals.includes(0)) ok = false;
    if (!ok) continue;

const endsKey = (a, n) => (n % 2 === 0 ? (a > 0 ? 'uu' : 'dd') : (a > 0 ? 'du' : 'ud'));
const ENDS = {
  uu: { label: 'Both ends up', path: 'M4 4 Q22 52 40 4' },
  dd: { label: 'Both ends down', path: 'M4 26 Q22 -22 40 26' },
  du: { label: 'Down left, up right', path: 'M4 26 C18 26 26 4 40 4' },
  ud: { label: 'Up left, down right', path: 'M4 4 C18 4 26 26 40 26' }

const endsSvg = k => `<svg viewBox="0 0 44 30" aria-hidden="true"><path d="${ENDS[k].path}"/></svg>`;

/* ---------- save ---------- */
const SAVE = 'curve-coaster-v1';
let S = { xp: 0, streak: 0, best: 0, stars: [0, 0, 0, 0, 0] };

  document.getElementById('xp').textContent = S.xp;
  document.getElementById('streak').textContent = S.streak;
  document.getElementById('best').textContent = S.best;
}

/* ---------- the track canvas ---------- */
const graphs = new Set();
class Graph {
  constructor(host, cfg = {}) {
    this.host = host;
    this.cv = document.createElement('canvas');
    host.appendChild(this.cv);
    this.cfg = Object.assign({ xmin: -7, xmax: 7, curves: [], flags: [], stations: false, turns: false, arrows: true, onTap: null }, cfg);
    this.carT = null;
    graphs.add(this);
    if (this.cfg.onTap) {
      this.cv.classList.add('tappable');
      this.cv.addEventListener('click', e => {
        const r = this.cv.getBoundingClientRect();
        const x = this.cfg.xmin + (e.clientX - r.left) / r.width * (this.cfg.xmax - this.cfg.xmin);
        this.cfg.onTap(Math.max(-6, Math.min(6, Math.round(x))), x);
      });
    }
    this.draw();
  }
  set(c) { Object.assign(this.cfg, c); this.draw(); }
  launch(done) {
    if (this.raf) cancelAnimationFrame(this.raf);
    if (reduced) { this.carT = null; this.draw(); done && done(); return; }
    const dur = 2800, t0 = performance.now();
    const step = now => {
      this.carT = Math.min(1, (now - t0) / dur);
      this.draw();
      if (this.carT < 1) this.raf = requestAnimationFrame(step);
      else { this.raf = null; setTimeout(() => { this.carT = null; this.draw(); }, 300); done && done(); }
    };
    this.raf = requestAnimationFrame(step);
  }
  prep(c) {
    if (c._M) return;
    if (c.M) { c._M = c.M; return; }
    let lo = -1.8, hi = 1.8;
    if (c.zeros && c.zeros.length) {
      const pad = c.zeros.length > 1 ? 0.7 : 1.5;
      lo = Math.min(...c.zeros) - pad; hi = Math.max(...c.zeros) + pad;
    }
    lo = Math.max(lo, this.cfg.xmin); hi = Math.min(hi, this.cfg.xmax);

    for (let i = 0; i <= 400; i++) { const y = Math.abs(c.fn(lo + (hi - lo) * i / 400)); if (isFinite(y) && y > M) M = y; }
    c._M = M || 1;
  }
  draw() {
    if (!this.host.isConnected) { graphs.delete(this); return; }
    const cv = this.cv, w = this.host.clientWidth || 600;
    const H = this.cfg.h || Math.round(Math.min(380, Math.max(230, w * 0.56)));

  sec: '3.2', name: 'Division Machine', topic: 'Synthetic division', tagline: 'Divide by (x − c) in a few quick moves, and learn what the remainder tells you.',
  learn: [
    { t: 'First: what is polynomial division?', b: `<p>Division asks how many times one quantity fits into another. In <b>12 ÷ 3 = 4</b>, 12 is what we divide, 3 is what we divide by, and 4 is the result (quotient).</p><p>Polynomial division works with expressions containing x. <b>Synthetic division</b> is a faster way to divide a polynomial by a divisor like (x − 2). We will first learn to set up the numbers, then bring down, multiply, and add. After you understand that process, we'll learn what the remainder tells us.</p><p>The picture names the four parts of a division, first for numbers and then for polynomials.</p>`,
      visual: () => `<div class="m-div"><span class="m-dp"><b>17</b><small>dividend</small></span><span class="m-dop">÷</span><span class="m-dp"><b>5</b><small>divisor</small></span><span class="m-dop">=</span><span class="m-dp"><b>3</b><small>quotient</small></span><span class="m-dop">R</span><span class="m-dp"><b>2</b><small>remainder</small></span></div><div class="m-div"><span class="m-dp"><b>f(x)</b><small>dividend</small></span><span class="m-dop">÷</span><span class="m-dp"><b>(x − c)</b><small>divisor</small></span><span class="m-dop">=</span><span class="m-dp"><b>q(x)</b><small>quotient</small></span><span class="m-dop">R</span><span class="m-dp"><b>r</b><small>remainder</small></span></div>`,
      check: { q: `In 20 ÷ 4 = 5, what do we call the answer 5?`, opts: ['Quotient', 'Divisor', 'Remainder'], ans: 0, why: ['Yes. The result of division is called the quotient.', 'The divisor is the number you divide by: 4.', 'A remainder is what is left over, if anything.'] } },
    { t: 'Find the numbers we need', b: `<p>Before using the division machine, we need to take a polynomial apart.</p><p>Look at <b>3x<sup>3</sup> ${MINUS} 2x + 5</b>. A <b>coefficient</b> is the number multiplying an x term. Here, those numbers are <b>3</b> and <b>${MINUS}2</b>. The <b>5</b> is the constant, because it has no x.</p><p>The small raised numbers tell us the <b>powers</b>. Write the terms from the biggest power to the smallest:</p><div class="math-table" aria-label="Powers and coefficients"><div class="cell head">x³</div><div class="cell head">x²</div><div class="cell head">x</div><div class="cell head">number</div><div class="cell">3</div><div class="cell blank">0</div><div class="cell">${MINUS}2</div><div class="cell">5</div></div><p><b>Why is there a 0?</b> There is no x<sup>2</sup> term. The 0 saves its place so our numbers don't shift into the wrong columns.</p><div class="ex"><span><b>The top row is:</b> 3, 0, ${MINUS}2, 5</span><span><b>Next, the number on the left:</b> If we divide by (x ${MINUS} 3), ask what makes x ${MINUS} 3 = 0. It's <b>3</b>.</span><span class="lesson-note">We'll practice the sign of that left-hand number separately. For now, focus on finding the top row.</span></div>`,
      check: { q: `Which coefficients go across the top for 5x<sup>3</sup> ${MINUS} 28x + 8?`, opts: [`5, 0, ${MINUS}28, 8`, `5, ${MINUS}28, 8`, `8, ${MINUS}28, 0, 5`], ans: 0, why: ['Right. The 0 holds the x<sup>2</sup> place.', 'There is no x<sup>2</sup> term, so it needs a 0 placeholder.', 'Use descending order: highest power first.'] } },
    { t: 'Bring down, multiply, add', b: `<p>You are going to perform the three moves in the table yourself:</p><ol class="playbook"><li><b>Bring down</b> the first coefficient.</li><li><b>Multiply</b> it by the number in the box, and write the result under the next coefficient.</li><li><b>Add</b> that column.</li></ol><p>Drag the first number straight down. Then type each multiplication and addition into the highlighted empty box. This is (3x<sup>3</sup> ${MINUS} 2x + 5) ÷ (x ${MINUS} 3).</p>`,
      widget: h => synthWidget(h, [3, 0, -2, 5], 3, 'demo'), check: null },
    { t: 'Read the result', visual: () => synthTable([3, 0, -2, 5], 3), b: `<p>The <b>last</b> number in the bottom row is the remainder. The others are the quotient's coefficients, starting <b>one power lower</b> than f.</p><div class="ex"><span>Bottom row: 3, 9, 25 | 80</span><span>q(x) = 3x<sup>2</sup> + 9x + 25, remainder 80</span><span>So f(3) = 80, and 3 is not a zero.</span></div>`,
      check: { q: `Dividing a cubic gives the bottom row 1, ${MINUS}2, 5 | 0. What is the quotient?`, opts: [`x<sup>2</sup> ${MINUS} 2x + 5, remainder 0`, `x<sup>3</sup> ${MINUS} 2x<sup>2</sup> + 5x, remainder 0`, `x ${MINUS} 2, remainder 5`], ans: 0, why: ['Yes, and remainder 0 means c is a zero.', 'The quotient starts one power lower than the cubic: x<sup>2</sup>.', 'The last number (0) is the remainder; the three before it form the quotient.'] } }
  ],
  play: { custom: playSynth },
  rounds: () => [synthRound(false), synthRound(true), synthRound(false), synthRound(true), synthRound(false)]
},
{
  sec: '3.2', name: 'Zero Hunt', topic: 'Rational Zero Theorem', tagline: 'List the suspects, test them, and track down every rational zero.',
  learn: [
    { t: 'Where rational zeros hide', visual: () => `<div class="m-div"><span class="m-dp"><b>± p</b><small>factor of the constant</small></span><span class="m-dop">/</span><span class="m-dp"><b>q</b><small>factor of the leading coefficient</small></span></div>`, b: `<p>If f has integer coefficients, every rational zero has the form <b>p/q</b>:</p><div class="ex"><span>p is a factor of the <b>constant term</b></span><span>q is a factor of the <b>leading coefficient</b></span></div><p>Not every candidate is a zero. The list tells you where to look.</p>`,
      check: { q: `f(x) = x<sup>3</sup> + 2x<sup>2</sup> ${MINUS} 5x ${MINUS} 6. Which is a possible rational zero?`, opts: [`${MINUS}3`, '4', '1/2'], ans: 0, why: ['Yes. 3 divides 6, and q can only be 1.', '4 does not divide the constant term, 6.', 'The leading coefficient is 1, so q = 1 and fractions are impossible.'] } },
    { t: 'Build the suspect list', b: `<p>Make every ±p/q, then cross off repeats (2/2 is the same number as 1/1).</p><div class="ex"><span class="eq small">f(x) = ${MINUS}4x<sup>4</sup> ${MINUS} 6x<sup>3</sup> + x<sup>2</sup> ${MINUS} x + 2</span><span>p: 1, 2 &nbsp;·&nbsp; q: 1, 2, 4</span><span>Candidates: ±1, ±2, ±1/2, ±1/4</span></div>`,
      check: { q: `How many candidates does x<sup>3</sup> + 2x<sup>2</sup> ${MINUS} 5x ${MINUS} 6 have?`, opts: ['8', '4', '6'], ans: 0, why: ['Right: ±1, ±2, ±3, ±6. Four factors of 6, each with + and ' + MINUS + '.', 'Those are the factors 1, 2, 3, 6, but each candidate comes in a + and a ' + MINUS + ' version.', 'List the factors of 6 first, then give each one a + and a ' + MINUS + ' version.'] } },
    { t: 'Test, then shrink', b: `<p>Test candidates with synthetic division. A remainder of 0 means you found a zero. Then keep working with the smaller quotient: once it is a quadratic, factor it or use the quadratic formula.</p><div class="ex"><span>Test ${MINUS}1 on x<sup>3</sup> + 2x<sup>2</sup> ${MINUS} 5x ${MINUS} 6: remainder 0</span><span>Quotient: x<sup>2</sup> + x ${MINUS} 6 = (x + 3)(x ${MINUS} 2)</span><span>Zeros: ${MINUS}3, ${MINUS}1, 2</span></div>`,
      curve: () => ({ fn: x => horner([1, 2, -5, -6], x), zeros: [-3, -1, 2], style: 'main' }), eq: `f(x) = x<sup>3</sup> + 2x<sup>2</sup> ${MINUS} 5x ${MINUS} 6`, stations: true,
      check: { q: 'With a graph available, which candidates should you test first?', opts: ['The ones where the track meets the ground', 'The largest ones', 'The fractions'], ans: 0, why: ['Yes. The graph points straight at the real zeros.', 'Size does not matter. Look where the track meets the ground.', 'Check the graph first; it shows which candidates are worth testing.'] } }
  ],
  play: { custom: playHunt },
  rounds: () => [candRound(), huntRound(), candRound(), huntRound(), huntRound()]
},
{
  sec: '3.3', name: 'Hidden Stations', topic: 'Complex zeros', tagline: 'Find the zeros that never touch the ground.',
  learn: [
    { t: 'Some stations are underground', b: `<p>The <b>Fundamental Theorem of Algebra</b>: a polynomial of degree n has exactly <b>n</b> complex zeros, counting multiplicity.</p><p>The graph shows only the <b>real</b> ones. Non-real zeros, like 2i, never touch the x-axis, so they stay hidden underground.</p>`,
      curve: () => ({ fn: x => (x - 2) * (x * x + 4), zeros: [2], style: 'main' }), eq: `f(x) = (x ${MINUS} 2)(x<sup>2</sup> + 4)`, stations: true,
      check: { q: 'This f has degree 3 and one real station, at x = 2. How many non-real zeros does it have?', opts: ['2', '0', '3'], ans: 0, why: ['Yes: 3 zeros in all, minus 1 real one. They are 2i and ' + MINUS + '2i.', 'Degree 3 means 3 zeros in all, so 2 are hidden.', 'One of the three zeros is the real station at 2.'] } },
    { t: 'Complex zeros come in pairs', visual: () => complexPlane({ R: 4, mirror: true, pts: [{ a: 3, b: 1, t: '3 + i', dx: 0, dy: -12, anchor: 'middle' }, { a: 3, b: -1, t: '3 − i', dx: 0, dy: 22, anchor: 'middle' }, { a: 0, b: 2, t: '2i' }, { a: 0, b: -2, t: '−2i' }], pairs: [[[3, 1], [3, -1]], [[0, 2], [0, -2]]], label: 'Conjugate pairs mirrored across the real axis' }), b: `<p>If the coefficients are real numbers and <b>a + bi</b> is a zero, then its <b>conjugate, a ${MINUS} bi</b>, is a zero too.</p><div class="ex"><span>3 ${MINUS} i pairs with 3 + i</span><span>2i pairs with ${MINUS}2i</span></div><p>Only the sign of the i part flips. The real part stays the same.</p>`,
      check: { q: '4 + 5i is a zero of a polynomial with real coefficients. Which must also be a zero?', opts: [`4 ${MINUS} 5i`, `${MINUS}4 ${MINUS} 5i`, `${MINUS}4 + 5i`], ans: 0, why: ['Correct.', 'Only the i part flips. The real part, 4, stays.', 'The real part stays 4; flip the sign of the 5i.'] } },
    { t: 'Odd degree keeps a real zero', b: `<p>Non-real zeros arrive in pairs, so they use up an even count. A polynomial of <b>odd</b> degree always has at least one real zero left over, and its track must cross the ground.</p><p>The ride above has degree 5: one real zero and two hidden pairs.</p>`,
      curve: () => ({ fn: x => (x + 1) * (x * x + 1) * (x * x + 4), zeros: [-1], style: 'main' }), eq: `f(x) = (x + 1)(x<sup>2</sup> + 1)(x<sup>2</sup> + 4)`, stations: true,
      check: { q: 'This ride has degree 5 and crosses the ground once. Could a degree 5 polynomial with real coefficients avoid the ground completely?', opts: ['No', 'Yes'], ans: 0, why: ['Right. Pairs can cover only 4 of the 5 zeros, so at least one is real, just like this ride.', 'Pairs cover an even number. With 5 zeros, at least one must be real, so the track must cross.'] } },
    { t: 'Using a given zero', b: `<p>From your notes: f(x) = x<sup>3</sup> ${MINUS} 4x<sup>2</sup> + 49x ${MINUS} 196, and ${MINUS}7i is a zero.</p><div class="ex"><span>1. Its partner, 7i, is also a zero.</span><span>2. Multiply the pair: (x ${MINUS} 7i)(x + 7i) = x<sup>2</sup> + 49.</span><span>3. Divide f by x<sup>2</sup> + 49 to find the last factor.</span></div><div class="tip"><b>Shortcut:</b> (x ${MINUS} bi)(x + bi) = x<sup>2</sup> + b<sup>2</sup>, because i<sup>2</sup> = ${MINUS}1.</div>`,
      curve: () => ({ fn: x => horner([1, -4, 49, -196], x), zeros: [4], style: 'main' }), eq: `f(x) = x<sup>3</sup> ${MINUS} 4x<sup>2</sup> + 49x ${MINUS} 196`, stations: true, after: true,
      check: { q: 'Finish step 3: dividing this f by x<sup>2</sup> + 49 leaves which last zero?', opts: ['4', `${MINUS}4`, '49'], ans: 0, why: ['Yes: f(x) = (x<sup>2</sup> + 49)(x ' + MINUS + ' 4). The zeros are 4, 7i, and ' + MINUS + '7i, and only 4 touches the ground.', 'The leftover factor is (x ' + MINUS + ' 4), so the zero is 4.', '49 is the constant of x<sup>2</sup> + 49, rather than a zero.'] } },
  ],
  play: { custom: playComplex },
  rounds: () => [pairSetRound(), givenZeroRound(), countRound(), pairSetRound(), givenZeroRound()]
},
{
  sec: '3.4', name: 'Walls and Holes', topic: 'Domain, vertical asymptotes, holes', tagline: 'Find where a rational ride is blocked, and where it only skips a bolt.',
  learn: [
    { t: 'A fraction of polynomials', b: `<p>A <b>rational function</b> is one polynomial divided by another: R(x) = p(x)/q(x).</p><p>Its <b>domain</b> is every real number except where the denominator equals 0, since dividing by zero is undefined.</p><div class="ex"><span>Example: R(x) = (x<sup>2</sup> ${MINUS} 7x ${MINUS} 8) / (3(x<sup>2</sup> ${MINUS} 36))</span><span>x<sup>2</sup> ${MINUS} 36 = 0 when x = ${MINUS}6 or x = 6</span><span>Domain: {x | x ≠ ${MINUS}6, x ≠ 6}</span></div><p>Now try the ride above; it launches once you answer.</p>`,
      curve: () => ratCurve({ kn: 12, kd: 1, num: [0], den: [7] }), eq: 'R(x) = ' + fracHtml('12x', `x ${MINUS} 7`), view: [-4, 10], after: true, stations: true,
      check: { q: 'What is the domain of this ride?', opts: ['{x | x ≠ 7}', '{x | x ≠ 0}', 'All real numbers'], ans: 0, why: ['Yes. x ' + MINUS + ' 7 = 0 at x = 7, so the track hits a wall there.', 'x = 0 makes the top zero, which is allowed. Only the bottom matters.', 'x = 7 makes the denominator 0, so it is left out.'] } },
    { t: 'Walls', b: `<p>Write R in lowest terms. Every zero of the denominator that remains is a <b>vertical asymptote</b>: a wall. The track races up or down beside it but never crosses it.</p><p>Find the walls of the ride above; it launches once you answer.</p>`,
      curve: () => ratCurve(M1), eq: 'R(x) = ' + ratLabel(M1), stations: true, after: true,
      check: { q: 'Where are the walls of this ride?', opts: [`x = ${MINUS}4 and x = 3`, `x = ${MINUS}2`, `x = 4 and x = ${MINUS}3`], ans: 0, why: [`Yes. (x ${MINUS} 3) and (x + 4) are zero there. Watch the track race beside each gold wall.`, `x = ${MINUS}2 makes the top zero: that is a station, rather than a wall.`, `Flip the signs: (x ${MINUS} 3) gives 3, and (x + 4) gives ${MINUS}4.`] } },
    { t: 'Holes', b: `<p>If the same factor appears on the top and the bottom, it cancels. That x is still left out of the domain, but the graph gets a <b>hole</b> (an open circle) there, rather than a wall.</p><div class="ex"><span>Example from your notes: (x<sup>2</sup> + x ${MINUS} 90)/(x<sup>2</sup> ${MINUS} x ${MINUS} 72)</span><span>= (x + 10)(x ${MINUS} 9) / ((x ${MINUS} 9)(x + 8))</span><span>(x ${MINUS} 9) cancels: hole at x = 9, wall at x = ${MINUS}8</span></div><p>Now find the hole in the ride above.</p>`,
      curve: () => ratCurve(M2), eq: 'R(x) = ' + ratLabel(M2), stations: true, after: true,
      check: { q: 'Where is the hole in this ride?', opts: ['x = 2', `x = ${MINUS}1`, `x = ${MINUS}3`], ans: 0, why: [`Yes. (x ${MINUS} 2) cancels, so the track skips that single point: look for the open circle.`, `(x + 1) stays in the bottom, so x = ${MINUS}1 is a wall.`, `x = ${MINUS}3 makes the top zero: that is a station.`] } },
    { t: 'Factor first, always', b: `<p>You cannot see walls, holes, or x-intercepts until the top and bottom are both factored. Factor, cancel, then read.</p><div class="tip"><b>Solo move:</b> zeros of the top (after canceling) are stations. Zeros of the bottom (after canceling) are walls. Canceled factors are holes.</div>`,
      check: { q: `Factor x<sup>2</sup> + 2x ${MINUS} 48.`, opts: [`(x + 8)(x ${MINUS} 6)`, `(x ${MINUS} 8)(x + 6)`, `(x + 12)(x ${MINUS} 4)`], ans: 0, why: [`Yes: 8 · (${MINUS}6) = ${MINUS}48 and 8 + (${MINUS}6) = 2.`, `Those multiply to ${MINUS}48 but add to ${MINUS}2. You need +2.`, 'Those multiply to ' + MINUS + '48 but add to 8.'] } }
  ],
  play: { custom: playRational },
  rounds: () => [domainRound(), wallsRound(), wallsRound(), domainRound(), wallsRound()]
},
{
  sec: '3.4', name: 'The Horizon', topic: 'Horizontal and slant asymptotes', tagline: 'Compare degrees to see where a rational ride levels off far away.',
  learn: [
    { t: 'The horizon line', b: `<p>Far to the left and right, many rational rides level off toward a horizontal line: the <b>horizontal asymptote</b>. On this ride it is the gold dashed line at y = 2.</p><p>Unlike a wall, the track is allowed to cross a horizon in the middle.</p>`,
      curve: () => ratCurve(M3), eq: 'R(x) = ' + ratLabel(M3), stations: true,
      check: { q: `Follow this ride near x = ${MINUS}1. What does the track do there?`, opts: ['It crosses the horizon line', 'It hits a wall'], ans: 0, why: ['Right. A horizon only describes the far ends, so the middle can cross it. Only walls can never be crossed.', `The walls are at x = ${MINUS}2 and x = 3. At x = ${MINUS}1 the track crosses the horizon line.`] } },
    { t: 'Compare the degrees', b: `<p>Call the top's degree n and the bottom's degree m.</p><div class="ex"><span><b>n &lt; m</b> (bottom heavier): y = 0</span><span><b>n = m</b>: y = leading coefficient of top ÷ leading coefficient of bottom</span><span><b>n &gt; m</b>: no horizontal asymptote. If n = m + 1, there is a slant (oblique) asymptote.</span></div><p>Try it on the ride above; it launches once you answer.</p>`,
      curve: () => ratCurve({ kn: 12, kd: 3, num: [0], den: [7 / 3] }), eq: 'F(x) = ' + fracHtml('12x', `3x ${MINUS} 7`), after: true, stations: true,
      check: { q: 'What is the horizontal asymptote of this ride?', opts: ['y = 4', 'y = 0', 'None'], ans: 0, why: ['Yes. Degrees match (1 and 1), so 12 ÷ 3 = 4. Watch the ride level off at the gold line.', 'y = 0 needs the bottom to have the higher degree. Here they are equal.', 'Equal degrees always give a horizontal asymptote.'] } },
    { t: 'Slant asymptotes', b: `<p>When the top is exactly one degree higher, divide (long or synthetic division). The quotient, without the remainder, is the slant line.</p><div class="ex"><span>Example from your notes: (x<sup>2</sup> ${MINUS} 18x ${MINUS} 19)/(x + 12)</span><span>Synthetic with ${MINUS}12: 1, ${MINUS}30 | 341</span><span>Slant asymptote: y = x ${MINUS} 30</span></div><p>Now find the slant line for the ride above.</p>`,
      curve: () => ratCurve(M4), eq: 'R(x) = ' + fracHtml(`x<sup>2</sup> ${MINUS} x ${MINUS} 12`, `x ${MINUS} 1`), after: true, stations: true,
      check: { q: 'What is the slant asymptote of this ride?', opts: ['y = x', `y = x ${MINUS} 1`, 'y = x + 1'], ans: 0, why: [`Yes. Synthetic division with 1 gives 1, 0 | ${MINUS}12. Drop the remainder: y = x + 0 = x.`, `Run the division: bring down 1, multiply by 1, and add to ${MINUS}1 to get 0. So y = x.`, `Put 1 in the box for (x ${MINUS} 1), then add: ${MINUS}1 + 1 = 0.`] } },
    { t: 'The full analysis', b: `<p>Your notes use this routine for any rational function:</p><ol class="playbook">${RAT_PLAYBOOK()}</ol>`, check: null }
  ],
  play: { custom: playRational },
  rounds: () => [haRound(), haRound(), obliqueRound(), fullRound(), fullRound()]
},
{
  sec: '3.6', name: 'Above or Below', topic: 'Polynomial and rational inequalities', tagline: 'Find every stretch where the ride is above or below the ground.',
  learn: [
    { t: 'Read the symbols', b: `<p>Solving an inequality means finding where the track is above or below the ground.</p><div class="ex"><span>f(x) &gt; 0: track <b>above</b> the ground</span><span>f(x) &lt; 0: track <b>below</b> the ground</span><span>≥ and ≤ also include the stations, where f(x) = 0</span></div><p>On the ride above, green marks where f(x) &gt; 0.</p>`,
      demo: { a: 1, roots: R([[-3, 1], [2, 1]]) }, stations: true, cfg: () => ineqView(polyModel(1, R([[-3, 1], [2, 1]])), '>'),
      check: { q: 'Green shows f(x) &gt; 0 on this ride. Where is f(x) ≤ 0?', opts: [`From ${MINUS}3 to 2, including both`, `Left of ${MINUS}3 and right of 2`, `Only at ${MINUS}3 and 2`], ans: 0, why: ['Yes: the track is below or on the ground there.', 'That is the green part, where f(x) > 0.', 'The stations count, and so does everything between them, where the track dips below the ground.'] } },
    { t: 'Split the ground at stations', b: `<p>The stations split the number line into intervals. Inside one interval the track stays on one side of the ground, so a single test point (or one glance at the graph) settles the whole interval.</p><p>Green shows f(x) ≥ 0 here. Notice the bounce at ${MINUS}1 does not break up the green stretch.</p>`,
      demo: { a: -1, roots: R([[-4, 1], [-1, 2], [3, 1]]) }, stations: true, cfg: () => ineqView(polyModel(-1, R([[-4, 1], [-1, 2], [3, 1]])), '≥'),
      check: { q: 'Between two neighboring stations, can the track switch sides?', opts: ['No, it stays on one side', 'Yes, any number of times'], ans: 0, why: ['Right. Switching sides would need another station in between.', 'To switch sides the track must meet the ground, and that spot would be another station.'] } },
    { t: 'Interval notation', visual: () => numberLine({ pts: [{ t: '−2', state: 'closed' }, { t: '3', state: 'closed' }], shade: [true, false, true], label: 'Example: (−∞, −2] ∪ [3, ∞)' }), b: `<p>Write the answer as intervals:</p><div class="ex"><span>( ) parenthesis: endpoint <b>excluded</b></span><span>[ ] bracket: endpoint <b>included</b></span><span>∞ and ${MINUS}∞ always get a parenthesis</span><span>∪ joins separate pieces</span></div><p>The picture shows the example (${MINUS}∞, ${MINUS}2] ∪ [3, ∞): closed dots match the brackets.</p>`,
      check: { q: 'x ≤ 4 in interval notation?', opts: [`(${MINUS}∞, 4]`, `(${MINUS}∞, 4)`, '[4, ∞)'], ans: 0, why: ['Yes. 4 is included, so it gets a bracket.', '≤ includes 4, so use a bracket.', `x ≤ 4 runs to the left of 4, toward ${MINUS}∞.`] } },
    { t: 'Walls are never included', b: `<p>For a rational inequality, split the ground at the stations <b>and</b> at the walls (zeros of the denominator). R is undefined at a wall, so a wall always gets a parenthesis, even with ≥ or ≤.</p><p>Green shows R(x) ≥ 0 for the ride below. A filled dot means the endpoint is included; an open dot means it is not.</p>`,
      curve: () => ratCurve(M5), eq: 'R(x) = ' + ratLabel(M5), stations: true, cfg: () => ineqView(ratIneqModel(M5), '≥'),

function roundTap(panel, rd, finish) {

  const out = panel.querySelector('.fb');

  const g = new Graph(panel.querySelector('.stage'), { onTap: x => { if (solved) return; flags = flags.includes(x) ? flags.filter(f => f !== x) : [...flags, x]; g.set({ flags }); } });

    if (solved) return;

    const missing = zs.filter(z => !flags.includes(z)), extra = flags.filter(f => !zs.includes(f));
    if (!missing.length && !extra.length) {

    }
    tries++;
    const flipped = missing.find(z => z !== 0 && extra.includes(-z));
    let msg;
    if (flipped !== undefined) msg = `Sign check: ${fmtFactor(flipped)} = 0 when x = ${N(flipped)}. The number inside flips its sign.`;
    else if (missing.includes(0)) msg = 'The plain x factor counts too: x = 0 is a station.';
    else if (extra.includes(rd.a)) msg = `The ${N(rd.a)} in front is a constant. It never equals zero, so it is not a station.`;
    else if (missing.length) msg = `This ride has ${zs.length} stations and you placed ${flags.length - extra.length} of them. Set each factor equal to 0.`;
    else msg = `There is an extra flag at x = ${N(extra[0])}. No factor equals zero there.`;

function renderChallenge(panel, i) {

const SOLO_TOPICS = [
  ['3.1','Polynomials & graphs'], ['3.2','Division & real zeros'], ['3.3','Complex zeros'],
  ['3.4–3.5','Rational functions'], ['3.6','Inequalities']

let soloSection = '3.1', soloProblem = null, soloHints = 0, soloMisses = 0, soloResolved = false;

function soloNorm(s) { return String(s).toLowerCase().replace(/[−–]/g,'-').replace(/\s+/g,'').replace(/[{}]/g,'').replace(/infinity|inf/g,'∞').replace(/\u221e/g,'∞').replace(/\u222a/g,'u').replace(/\bor\b/g,',').replace(/\+/g,'+'); }
function soloQ(text, answer, hints, explain, validator) { return {text,answer:String(answer),hints,explain,validator:validator || ((v)=>soloNorm(v)===soloNorm(answer))}; }
function soloNum(t,a,h,e) {return soloQ(t,a,h,e,v=>{const n=parseNum(v);return Number.isFinite(n)&&Math.abs(n-a)<1e-8;});}
function soloPair(t,values,h,e){return soloQ(t,values.join(', '),h,e,v=>{let a=String(v).replace(/[−–]/g,'-').split(/[,;]/).map(x=>parseNum(x.trim()));return a.length===values.length&&a.every(Number.isFinite)&&a.sort((x,y)=>x-y).every((x,i)=>Math.abs(x-[...values].sort((x,y)=>x-y)[i])<1e-8);});}
function soloGenerate(topic) {

    case '3.1': {

      const poly31=fmtStd([a,...Array(b-2).fill(0),c||1,2]);
      if(variant===0) return soloNum(`For f(x) = ${poly31}, what is the degree?`,b,['The degree is the highest exponent on x.','Look for the exponent on the leading term.'],`The largest power is ${b}, so the degree is ${b}.`);

      if(variant===2) return soloQ(`For f(x) = ${fmtStd([a,...Array(b-2).fill(0),1,-7])}, describe its end behavior with two letters: left then right. Use U for up or D for down.`,endsKey(a,b).toUpperCase().replace(/U/g,'U').replace(/D/g,'D'),['Only the leading term controls end behavior.',`Degree ${b} is ${b%2?'odd':'even'}; the leading coefficient is ${a>0?'positive':'negative'}.`],`A ${b%2?'odd':'even'} degree and ${a>0?'positive':'negative'} leading coefficient gives ${ENDS[endsKey(a,b)].label.toLowerCase()}.`,v=>soloNorm(v)===endsKey(a,b));
      root=pick([-5,-4,-3,-2,2,3,4,5]); k=pick([-4,-2,2,3]); return soloNum(`For f(x) = ${N(k)}(x ${root>0?'− '+root:'+ '+(-root)})(x + 1), what is the zero other than −1?`,root,['A zero makes one factor equal 0.',`Solve x ${root>0?'− '+root:'+ '+(-root)} = 0.`],`Set x ${root>0?'− '+root:'+ '+(-root)} = 0, giving x = ${N(root)}. The number in front does not create a zero.`);
    }
    case '3.2': {
      const variant=rint(0,2); root=pick([-4,-3,-2,-1,1,3,4]); a=pick([1,2,3]); b=rint(-6,6); c=rint(-6,6);
      if(variant===0){const coef=[a,b,c];const val=horner(coef,root);return soloNum(`Use the Remainder Theorem. What is the remainder when ${fmtStd(coef)} is divided by ${divisorText(root)}?`,val,[`The remainder when dividing by x − r equals f(r).`,`Substitute ${N(root)} into the polynomial, including the sign.`],`f(${N(root)}) = ${a}(${N(root)})² + (${N(b)})(${N(root)}) + (${N(c)}) = ${N(val)}.`);}
      if(variant===1){const coef=[1,-(root+2),root*2];return soloPair(`Find both real zeros of f(x) = ${fmtStd(coef)}. Enter two numbers separated by a comma.`,[root,2],[`Factor the quadratic into two linear factors.`,`Find two numbers that multiply to ${N(root*2)} and add to ${N(-(root+2))}.`],`The factors are ${divisorText(root)}(x − 2). Setting each to zero gives ${N(root)} and 2.`);}
      const cs=[a,b,c];const rows=synthRows(cs,root);return soloNum(`Divide ${fmtStd(cs)} by ${divisorText(root)} using synthetic division. What is the constant term of the quotient?`,rows.bot[1],[`The box number is ${N(root)}. Bring down ${a}, multiply by the box, and add to the next coefficient.`,`Multiply ${a} × ${N(root)}, then add ${N(b)}.`],`Bring down ${a}. ${a} × ${N(root)} = ${N(a*root)}. ${N(b)} + ${N(a*root)} = ${N(rows.bot[1])}. The quotient is ${fmtStd(rows.bot.slice(0,2))}, remainder ${N(rows.bot[2])}.`);
    }

      if(variant===0) return soloQ(`A polynomial with real coefficients has the complex zero ${fmtC(a,b)}. Type its required conjugate zero.`,fmtC(a,-b),['Nonreal zeros come in conjugate pairs when coefficients are real.','Keep the real part, but reverse the sign of the imaginary part.'],`The conjugate of ${fmtC(a,b)} is ${fmtC(a,-b)}.`,isCx([`${a}-${b}i`]));

      return soloNum(`A degree-${k=pick([3,5,7])} polynomial has how many complex zeros, counting multiplicity?`,k,['The Fundamental Theorem of Algebra counts zeros with multiplicity.','A degree-n polynomial has exactly n complex zeros counting multiplicity.'],`A polynomial of degree ${k} has exactly ${k} complex zeros counting multiplicity.`);
    }
    case '3.4–3.5': {

      if(variant===0) return soloNum(`For R(x) = (x + 2) / ${divisorText(root)}, which x-value must be excluded from the domain?`,root,['The denominator cannot equal zero.',`Solve ${divisorText(root)} = 0.`],`The denominator is zero at x = ${N(root)}, so x = ${N(root)} is excluded.`);

      if(variant===2) return soloQ(`For R(x) = (${a}x² + 1) / (${b}x² + x + 2), enter the horizontal asymptote as a fraction or whole number (without y =).`,fracStr(a,b),['Compare the degree of the numerator and denominator.','They have equal degrees: divide leading coefficients.'],`Both degrees are 2, so y = ${fracStr(a,b)}.`,v=>{const parts=soloNorm(v).replace(/^y=/,'').split('/').map(Number);return parts.length<=2&&parts.every(Number.isFinite)&&Math.abs(parts[0]/(parts[1]||1)-a/b)<1e-8;});
      return soloNum(`R(x) = ${divisorText(root)} / (${divisorText(root)}(x + 1)). What is the x-coordinate of the hole?`,root,['A canceled common factor creates a hole, not a vertical asymptote.','The repeated factor appears on top and bottom; find where it equals 0.'],`Canceling ${divisorText(root)} leaves a hole at x = ${N(root)}. The original domain still excludes that x-value.`);

    case '3.6': {
      const variant=rint(0,2);lo=pick([-5,-4,-3,-2,-1]);hi=pick([1,2,3,4,5]);
      if(variant===0) return soloQ(`Solve (x ${lo<0?'+ '+(-lo):'− '+lo})(x − ${hi}) < 0. Enter interval notation.`,`(${lo},${hi})`,['Find the two zeros and split the number line at them.',`The quadratic is negative between its two distinct zeros, ${lo} and ${hi}.`],`A positive-leading quadratic is below the x-axis between its zeros, so (${lo}, ${hi}). The inequality is strict, so exclude endpoints.`);
      if(variant===1) return soloQ(`Solve (x ${lo<0?'+ '+(-lo):'− '+lo})(x − ${hi}) ≤ 0. Enter interval notation.`,`[${lo},${hi}]`,['Factor zeros divide the number line into intervals.','The product is negative between its zeros; equality allows both zeros too.'],`Include both zeros because ≤ 0: [${lo}, ${hi}].`);
      return soloQ(`Solve (x − ${hi}) / (x ${lo<0?'+ '+(-lo):'− '+lo}) > 0. Enter interval notation, using U for union.`,`(-∞,${lo})U(${hi},∞)`,['Mark the numerator zero and denominator zero. Test signs on three intervals.',`The critical values are ${lo} (excluded denominator) and ${hi} (zero numerator). The fraction is positive outside these two values.`],`Signs agree on (−∞, ${lo}) and (${hi}, ∞), so the solution is (−∞, ${lo}) U (${hi}, ∞).`,v=>soloNorm(v).replace(/\|/g,'u')===soloNorm(`(-∞,${lo})u(${hi},∞)`));
    }
  }
}

  document.getElementById('soloNext').onclick=()=>{soloProblem=null;renderSolo();};
  const feedback=document.getElementById('soloFeedback');
  const explain=document.getElementById('soloExplain');
  if(soloResolved){fb(feedback,'info','You have finished this problem. Select New problem to continue.');explain.innerHTML=`<div class="ex"><b>Worked explanation</b><p>${soloProblem.explain}</p><p><b>Answer:</b> ${soloProblem.answer}</p></div>`;}
  const complete=(solved)=>{soloResolved=true;stats.total++;if(solved&&soloMisses===0&&soloHints===0)stats.clean++;save();document.getElementById('soloAnswer').disabled=true;document.getElementById('soloCheck').disabled=true;document.getElementById('soloHint').disabled=true;document.getElementById('soloReveal').disabled=true;explain.innerHTML=`<div class="ex"><b>Worked explanation</b><p>${soloProblem.explain}</p><p><b>Answer:</b> ${soloProblem.answer}</p></div>`;};
  const check=()=>{if(soloResolved)return;let v=document.getElementById('soloAnswer').value.trim();if(!v){fb(feedback,'info','Enter an answer first. You can use a hint if you need one.');return;}stats.attempts++;if(soloProblem.validator(v)){fb(feedback,'ok',soloHints===0&&soloMisses===0?'Correct, completely on your own. This counts toward independent mastery.':'Correct. Review the explanation, then try another without hints.');complete(true);}else{soloMisses++;fb(feedback,'no',`Not quite. Check your signs, the operation, or the notation. You can try again, get a hint, or reveal the solution.`);save();}};
  document.getElementById('soloCheck').onclick=check;
  document.getElementById('soloAnswer').onkeydown=e=>{if(e.key==='Enter')check();};
  document.getElementById('soloHint').onclick=()=>{soloHints++;fb(feedback,'info',soloProblem.hints[Math.min(soloHints-1,soloProblem.hints.length-1)]);};
  document.getElementById('soloReveal').onclick=()=>{fb(feedback,'info','Study this explanation, then try a new problem. Revealed answers never count as independent solves.');complete(false);};
}


/* ================== LEARNING MISSIONS v2: visual helpers ==================
   Every helper draws from real math (sampled functions, computed synthetic rows),
   uses theme tokens through CSS classes, and keeps labels in their own safe bands. */
const E = n => `<sup>${n}</sup>`;
const escA = s => String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
const r1 = v => Math.round(v * 10) / 10;

/* Function graph. Tick labels sit in a dedicated band under the plot so they never touch the curve. */
function miniGraph(o) {
  const W = o.w || 340, H = o.h || 220, pl = 6, pr = 6, pt = 6, pb = o.noTicks ? 6 : 26;
  const { xmin, xmax, ymin, ymax } = o, pw = W - pl - pr, ph = H - pt - pb;
  const X = x => pl + (x - xmin) / (xmax - xmin) * pw, Y = y => pt + (ymax - y) / (ymax - ymin) * ph;
  const cid = uid();
  let g = `<svg class="vx ${o.cls || ''}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${escA(o.label || 'Graph')}"><defs><clipPath id="${cid}"><rect x="${pl}" y="${pt}" width="${pw}" height="${ph}" rx="6"/></clipPath></defs>`;
  g += `<rect class="vx-bg" x="${pl}" y="${pt}" width="${pw}" height="${ph}" rx="6"/>`;
  const step = o.step || 1;
  const xs = []; for (let x = Math.ceil(xmin / step) * step; x <= xmax + 1e-9; x += step) xs.push(Math.round(x * 1000) / 1000);
  xs.forEach(x => { if (Math.abs(x) > 1e-9) g += `<line class="vx-grid" x1="${r1(X(x))}" x2="${r1(X(x))}" y1="${pt}" y2="${pt + ph}"/>`; });
  if (o.ystep) for (let y = Math.ceil(ymin / o.ystep) * o.ystep; y <= ymax + 1e-9; y += o.ystep) if (Math.abs(y) > 1e-9) g += `<line class="vx-grid" x1="${pl}" x2="${pl + pw}" y1="${r1(Y(y))}" y2="${r1(Y(y))}"/>`;
  if (ymin < 0 && ymax > 0) g += `<line class="vx-ground" x1="${pl}" x2="${pl + pw}" y1="${r1(Y(0))}" y2="${r1(Y(0))}"/>`;
  if (xmin < 0 && xmax > 0) g += `<line class="vx-axis" x1="${r1(X(0))}" x2="${r1(X(0))}" y1="${pt}" y2="${pt + ph}"/>`;
  if (!o.noTicks) {
    const gap = pw / ((xmax - xmin) / step);
    const every = gap < 30 ? 2 : 1;
    xs.forEach((x, i) => { if (Math.round(x / step) % every !== 0) return; const px = X(x), anc = px < pl + 12 ? 'start' : px > pl + pw - 12 ? 'end' : 'middle'; g += `<text class="vx-tick" x="${r1(anc === 'start' ? Math.max(px, pl) : anc === 'end' ? Math.min(px, pl + pw) : px)}" y="${H - 8}" text-anchor="${anc}">${N(x)}</text>`; });
  }
  g += `<g clip-path="url(#${cid})">`;
  (o.vas || []).forEach(v => { g += `<line class="vx-asym" x1="${r1(X(v))}" x2="${r1(X(v))}" y1="${pt}" y2="${pt + ph}"/>`; });
  if (o.ha != null) g += `<line class="vx-asym" x1="${pl}" x2="${pl + pw}" y1="${r1(Y(o.ha))}" y2="${r1(Y(o.ha))}"/>`;
  if (o.slant) { const [m, b] = o.slant; g += `<line class="vx-asym" x1="${r1(X(xmin))}" y1="${r1(Y(m * xmin + b))}" x2="${r1(X(xmax))}" y2="${r1(Y(m * xmax + b))}"/>`; }
  (o.bands || []).forEach(([a, b]) => { g += `<line class="vx-band" x1="${r1(X(Math.max(a, xmin)))}" x2="${r1(X(Math.min(b, xmax)))}" y1="${r1(Y(0))}" y2="${r1(Y(0))}"/>`; });
  const segs = [];
  const fns = o.fns || (o.fn ? [{ fn: o.fn, cls: '' }] : []);
  fns.forEach(F => {
    const vas = o.vas || [], n = 700, span = ymax - ymin; let cur = [];
    for (let i = 0; i <= n; i++) {
      const x = xmin + (xmax - xmin) * i / n;
      if (cur.length && vas.some(v => (cur[cur.length - 1][0] - v) * (x - v) <= 0)) { segs.push({ pts: cur, F }); cur = []; }
      if (vas.some(v => Math.abs(x - v) < 1e-9)) continue;
      let y = F.fn(x);
      if (!isFinite(y)) { if (cur.length) { segs.push({ pts: cur, F }); cur = []; } continue; }
      y = Math.max(ymin - 3 * span, Math.min(ymax + 3 * span, y));
      cur.push([x, y]);
    }
    if (cur.length) segs.push({ pts: cur, F });
  });
  segs.forEach(({ pts, F }) => { g += `<path class="vx-curve ${F.cls || ''}" d="${pts.map((p, i) => (i ? 'L' : 'M') + r1(X(p[0])) + ' ' + r1(Y(p[1]))).join('')}"/>`; });
  g += `</g>`;
  const arrow = (a, b, cls) => {
    const ax = X(a[0]), ay = Y(a[1]), bx = X(b[0]), by = Y(b[1]);
    let dx = ax - bx, dy = ay - by; const L = Math.hypot(dx, dy) || 1; dx /= L; dy /= L;
    const tx = Math.max(pl, Math.min(pl + pw, ax)), ty = Math.max(pt, Math.min(pt + ph, ay));
    const px = -dy, py = dx;
    return `<path class="vx-arrow ${cls || ''}" d="M${r1(tx + dx * 3)} ${r1(ty + dy * 3)}L${r1(tx - dx * 10 + px * 6)} ${r1(ty - dy * 10 + py * 6)}L${r1(tx - dx * 10 - px * 6)} ${r1(ty - dy * 10 - py * 6)}Z"/>`;
  };
  if (o.arrows !== false) {
    const inside = p => p[1] >= ymin && p[1] <= ymax;
    segs.forEach(({ pts, F }, si) => {
      if (F.noArrows || pts.length < 8) return;
      const first = o.arrows === 'ends' ? si === 0 : true, last = o.arrows === 'ends' ? si === segs.length - 1 : true;
      const i0 = pts.findIndex(inside); let j0 = -1; for (let k = pts.length - 1; k >= 0; k--) if (inside(pts[k])) { j0 = k; break; }
      if (first && i0 >= 0 && i0 + 4 < pts.length) g += arrow(pts[i0], pts[i0 + 4], F.cls);
      if (last && j0 >= 4) g += arrow(pts[j0], pts[j0 - 4], F.cls);
    });
  }
  if (o.turns) {
    const f = o.fn, n = 2000; let num = 0, prev = f(xmin), pd = 0;
    for (let i = 1; i <= n; i++) {
      const x = xmin + (xmax - xmin) * i / n, y = f(x), d = Math.sign(y - prev);
      if (d && pd && d !== pd) { const tx = xmin + (xmax - xmin) * (i - 1) / n, ty = f(tx); if (ty >= ymin && ty <= ymax) { num++; g += `<circle class="vx-ring" cx="${r1(X(tx))}" cy="${r1(Y(ty))}" r="11"/><text class="vx-ringnum" x="${r1(X(tx))}" y="${r1(Y(ty) + 4.5)}" text-anchor="middle">${num}</text>`; } }
      if (d) pd = d; prev = y;
    }
  }
  (o.zeros || []).forEach(z => { g += `<circle class="vx-zero" cx="${r1(X(z))}" cy="${r1(Y(0))}" r="5"/>`; });
  (o.holes || []).forEach(h => { g += `<circle class="vx-hole" cx="${r1(X(h.x))}" cy="${r1(Y(h.y))}" r="5.5"/>`; });
  (o.pts || []).forEach(p => { g += `<circle class="vx-pt" cx="${r1(X(p.x))}" cy="${r1(Y(p.y))}" r="5"/>`; });
  (o.labels || []).forEach(l => {
    const x = l.px != null ? l.px : X(l.x), y = l.py != null ? l.py : Y(l.y);
    g += `<text class="vx-lab ${l.cls || ''}" x="${r1(x + (l.dx || 0))}" y="${r1(y + (l.dy || 0))}" text-anchor="${l.anchor || 'start'}">${l.t}</text>`;
  });
  return g + '</svg>';
}

/* Complex plane: a separate picture from the graph of f. */
function complexPlane(o) {
  const W = o.w || 300, H = o.h || 250, R = o.R || 4, cx = W / 2, cy = (H - 10) / 2 + 4;
  const s = Math.min(W - 40, H - 40) / 2 / R;
  const X = a => cx + a * s, Y = b => cy - b * s;
  let g = `<svg class="vx vx-cplane" viewBox="0 0 ${W} ${H}" role="img" aria-label="${escA(o.label || 'Complex plane')}">`;
  for (let k = -R; k <= R; k++) {
    if (!k) continue;
    g += `<line class="vx-grid" x1="${r1(X(k))}" x2="${r1(X(k))}" y1="${r1(Y(R))}" y2="${r1(Y(-R))}"/><line class="vx-grid" x1="${r1(X(-R))}" x2="${r1(X(R))}" y1="${r1(Y(k))}" y2="${r1(Y(k))}"/>`;
  }
  g += `<line class="${o.mirror ? 'vx-mirror' : 'vx-axis'}" x1="${r1(X(-R) - 6)}" x2="${r1(X(R) + 6)}" y1="${r1(cy)}" y2="${r1(cy)}"/><line class="vx-axis" x1="${r1(cx)}" x2="${r1(cx)}" y1="${r1(Y(R) - 6)}" y2="${r1(Y(-R) + 6)}"/>`;
  g += `<text class="vx-axt" x="${r1(X(R) + 10)}" y="${r1(cy + 4)}" text-anchor="start">real</text><text class="vx-axt" x="${r1(cx + 6)}" y="${r1(Y(R) + 2)}" text-anchor="start">imaginary</text>`;
  const onRe = k => (o.pts || []).some(p => p.b === 0 && Math.abs(p.a - k) < 1.2), onIm = k => (o.pts || []).some(p => p.a === 0 && Math.abs(p.b - k) < 1.2);
  if (o.ticks !== false) for (let k = -R; k <= R; k += 2) { if (!k) continue; if (!onRe(k)) g += `<text class="vx-tick" x="${r1(X(k))}" y="${r1(cy + 16)}" text-anchor="middle">${N(k)}</text>`; if (!onIm(k)) g += `<text class="vx-tick" x="${r1(cx - 6)}" y="${r1(Y(k) + 4)}" text-anchor="end">${N(k)}i</text>`; }
  (o.pairs || []).forEach(([p, q]) => { g += `<line class="vx-pair" x1="${r1(X(p[0]))}" y1="${r1(Y(p[1]))}" x2="${r1(X(q[0]))}" y2="${r1(Y(q[1]))}"/>`; });
  (o.pts || []).forEach(p => {
    if (p.proj) g += `<path class="vx-proj" d="M${r1(X(p.a))} ${r1(Y(p.b))}V${r1(cy)}M${r1(X(p.a))} ${r1(Y(p.b))}H${r1(cx)}"/>`;
    g += `<circle class="${p.real ? 'vx-zero' : 'vx-pt'}" cx="${r1(X(p.a))}" cy="${r1(Y(p.b))}" r="6"/>`;
    g += `<text class="vx-lab" x="${r1(X(p.a) + (p.dx ?? 10))}" y="${r1(Y(p.b) + (p.dy ?? 5))}" text-anchor="${p.anchor || 'start'}">${p.t}</text>`;
  });
  return g + '</svg>';
}

/* Schematic number line / sign chart. Rows: signs, line, point labels, test points. */
function numberLine(o) {
  const W = o.w || 300, pad = 18, n = o.pts.length;
  const hasSigns = !!o.signs, hasTests = !!o.tests;
  const hasNotes = o.pts.some(p => p.note);
  const yS = 24, yL = hasSigns ? 62 : 26, yP = yL + 28, yN = yP + 16, yT = (hasNotes ? yN : yP) + 22, H = (hasTests ? yT : hasNotes ? yN : yP) + 10;
  const px = i => pad + (i + 1) * (W - 2 * pad) / (n + 1);
  const ix = i => (i === 0 ? (pad + px(0)) / 2 : i === n ? (px(n - 1) + W - pad) / 2 : (px(i - 1) + px(i)) / 2);
  let g = `<svg class="vx vx-nl" viewBox="0 0 ${W} ${H}" role="img" aria-label="${escA(o.label || 'Number line')}">`;
  g += `<line class="vx-axis" x1="${pad}" x2="${W - pad}" y1="${yL}" y2="${yL}"/>`;
  g += `<path class="vx-nlend" d="M${pad - 4} ${yL}l9 -6v12z M${W - pad + 4} ${yL}l-9 -6v12z"/>`;
  (o.shade || []).forEach((on, i) => { if (!on) return; const a = i === 0 ? pad : px(i - 1), b = i === n ? W - pad : px(i); g += `<line class="vx-shade" x1="${r1(a)}" x2="${r1(b)}" y1="${yL}" y2="${yL}"/>`; });
  if (hasSigns) o.signs.forEach((sg, i) => {
    const pos = sg === '+';
    g += `<rect class="${pos ? 'vx-signpos' : 'vx-signneg'}" x="${r1(ix(i) - 17)}" y="${yS - 15}" width="34" height="26" rx="8"/><text class="vx-sign" x="${r1(ix(i))}" y="${yS + 4}" text-anchor="middle">${pos ? '+' : '−'}</text>`;
  });
  o.pts.forEach((p, i) => {
    const x = r1(px(i));
    if (p.state === 'closed') g += `<circle class="vx-dotc" cx="${x}" cy="${yL}" r="7"/>`;
    else if (p.state === 'open') g += `<circle class="vx-doto" cx="${x}" cy="${yL}" r="7"/>`;
    else g += `<line class="vx-split" x1="${x}" x2="${x}" y1="${yL - 11}" y2="${yL + 11}"/>`;
    g += `<text class="vx-lab" x="${x}" y="${yP}" text-anchor="middle">${p.t}</text>`;
    if (p.note) g += `<text class="vx-tick" x="${x}" y="${yN}" text-anchor="middle">${p.note}</text>`;
  });
  if (hasTests) o.tests.forEach((t, i) => { if (t != null) g += `<text class="vx-tick" x="${r1(ix(i))}" y="${yT}" text-anchor="middle">test ${t}</text>`; });
  return g + '</svg>';
}

/* Term tiles: coefficient and exponent called out in separate, labelled rows. */
function termTiles(terms, o = {}) {
  const show = o.show || 'both';
  return `<div class="tiles" role="list">${terms.map((t, i) => {
    const neg = t.c < 0, abs = Math.abs(t.c);
    const op = i === 0 ? '' : `<span class="t-op" aria-hidden="true">${neg ? '−' : '+'}</span>`;
    const coefShown = t.e === 0 ? String(i === 0 && neg ? '−' + abs : abs) : (abs === 1 ? (i === 0 && neg ? '−' : '') : (i === 0 && neg ? '−' : '') + abs);
    const term = t.e === 0 ? `<span class="k-coef">${coefShown}</span>` : `<span class="k-coef">${coefShown}</span>x${t.e > 1 ? `<sup class="k-exp">${t.e}</sup>` : ''}`;
    const top = show === 'coef' || show === 'none' ? '' : `<span class="t-lab t-lab-exp">${t.e === 0 ? 'no x (power 0)' : `exponent <b>${t.e}</b>`}</span>`;
    const bot = show === 'exp' || show === 'none' ? '' : `<span class="t-lab t-lab-coef">${t.e === 0 ? `constant <b>${N(t.c)}</b>` : `coefficient <b>${N(t.c)}</b>`}</span>`;
    const tag = o.lead === i ? `<span class="t-tag">leading term</span>` : '';
    return `<span class="t-grp">${op}<div class="tile ${o.lead === i ? 'lead' : ''}" role="listitem">${tag}${top}<span class="t-term">${term}</span>${bot}</div></span>`;
  }).join('')}</div>`;
}

/* Vertical equation chain: one move per row, with a short note. */
const keepF = h => String(h).replace(/\(([^()<>]*)\)/g, m => m.replace(/ /g, '\u00a0'));
function eqChain(rows) {
  rows = rows.map(r => [keepF(r[0]), r[1]]);
  return `<div class="eqchain">${rows.map((r, i) => `${i ? '<span class="eqarrow" aria-hidden="true">↓</span>' : ''}<div class="eqrow"><span class="eqm">${r[0]}</span>${r[1] ? `<span class="eqnote">${r[1]}</span>` : ''}</div>`).join('')}</div>`;
}

/* Static synthetic division table. upto = number of moves revealed (bring down, multiply, add, ...). */
function synthTable(cs, c, o = {}) {
  const { mid, bot } = synthRows(cs, c), n = cs.length, upto = o.upto ?? Infinity;
  const order = k => (k === 0 ? 0 : 2 * k);
  const showB = k => order(k) < upto, showM = k => 2 * k - 1 < upto;
  const cur = o.cur || [];
  const cl = (r, k) => (cur[0] === r && cur[1] === k ? (r === 'm' ? ' stbl-curm' : ' stbl-curb') : '');
  return `<div class="stbl-wrap"><table class="stbl" aria-label="Synthetic division with ${N(c)} in the box">
    <tr><th scope="row" class="stbl-lab">top row</th><td class="stbl-box" rowspan="2"><span>${N(c)}</span></td>${cs.map(v => `<td>${N(v)}</td>`).join('')}</tr>
    <tr><th scope="row" class="stbl-lab">× ${N(c)}</th>${cs.map((_, k) => `<td class="stbl-mid${cl('m', k)}">${k && showM(k) ? N(mid[k]) : ''}</td>`).join('')}</tr>
    <tr class="stbl-bot"><th scope="row" class="stbl-lab">sum</th><td class="stbl-blank"></td>${cs.map((_, k) => `<td class="stbl-sum${k === n - 1 ? ' stbl-rem' : ''}${cl('b', k)}">${showB(k) ? N(bot[k]) : ''}</td>`).join('')}</tr>
  </table></div>`;
}
function synthNarr(cs, c, idx) {
  const { mid, bot } = synthRows(cs, c), n = cs.length, par = v => (v < 0 ? `(${N(v)})` : N(v));
  if (idx === 0) return { cur: ['b', 0], text: `<b>Bring down</b> the first coefficient, ${N(cs[0])}. Nothing is calculated yet.` };
  const k = Math.ceil(idx / 2);
  if (idx % 2) return { cur: ['m', k], text: `<b>Multiply</b> the newest bottom number by the box: ${par(bot[k - 1])} × ${par(c)} = ${N(mid[k])}. Write it under ${N(cs[k])}.` };
  return { cur: ['b', k], text: `<b>Add</b> the column: ${N(cs[k])} + ${par(mid[k])} = ${N(bot[k])}.${k === n - 1 ? ' This last sum is the <b>remainder</b>.' : ''}` };
}
/* Interactive demo: the learner steps through a worked example one move at a time. */
function synthStepper(cs, c) {
  return `<div class="stepper-demo" data-stepper="${escA(JSON.stringify({ cs, c }))}"><div data-st-table>${synthTable(cs, c, { upto: 0 })}</div><p class="stepper-say" aria-live="polite">Press <b>Next move</b> to watch the example one move at a time.</p><div class="row"><button class="btn small" data-st-next>Next move</button><button class="btn ghost small" data-st-reset>Start over</button></div></div>`;
}
function wireSteppers(root) {
  root.querySelectorAll('[data-stepper]').forEach(el => {
    const { cs, c } = JSON.parse(el.dataset.stepper), total = 2 * cs.length - 1;
    let k = 0;
    const tbl = el.querySelector('[data-st-table]'), say = el.querySelector('.stepper-say'), nx = el.querySelector('[data-st-next]');
    const draw = () => {
      if (k === 0) { tbl.innerHTML = synthTable(cs, c, { upto: 0 }); say.innerHTML = 'Press <b>Next move</b> to watch the example one move at a time.'; nx.disabled = false; return; }
      const nr = synthNarr(cs, c, k - 1);
      tbl.innerHTML = synthTable(cs, c, { upto: k, cur: nr.cur });
      say.innerHTML = `Move ${k} of ${total}: ${nr.text}`;
      nx.disabled = k >= total;
    };
    nx.onclick = () => { if (k < total) { k++; draw(); } };
    el.querySelector('[data-st-reset]').onclick = () => { k = 0; draw(); };
    draw();
  });
}

/* Small helpers for panels and chips */
const panels = arr => `<div class="m-panels">${arr.map(p => `<div class="m-panel"><p class="m-panel-h">${p.h}</p>${p.eq ? `<p class="m-panel-eq">${keepF(p.eq)}</p>` : ''}${p.sub ? `<p class="m-panel-sub">${p.sub}</p>` : ''}${p.body}${p.note ? `<p class="m-panel-note">${p.note}</p>` : ''}</div>`).join('')}</div>`;
const chips = arr => `<div class="m-chips">${arr.map(c => `<span class="m-chip">${keepF(c)}</span>`).join('')}</div>`;
const flow = arr => `<ol class="m-flow">${arr.map(c => `<li>${c}</li>`).join('')}</ol>`;

/* Answer checkers. Each returns (raw) => boolean. */
const nrm = v => String(v).trim().toLowerCase().replace(/[−–—]/g, '-').replace(/\s+/g, '').replace(/^(x|y|f\(0\))=/, '');
function parseFrac(s) {
  const t = nrm(s).replace(/^\+/, '');
  if (/^-?\d+(\.\d+)?$/.test(t)) return Number(t);
  const m = t.match(/^(-?\d+)\/(-?\d+)$/); if (m && +m[2] !== 0) return +m[1] / +m[2];
  return NaN;
}
const isNum = v => raw => Math.abs(parseFrac(raw) - v) < 1e-9;
const parseList = raw => String(raw).replace(/\band\b/gi, ',').split(/[,;]+/).map(s => s.trim()).filter(Boolean).map(parseFrac);
const isSet = vals => raw => { const a = parseList(raw); if (a.length !== vals.length || a.some(isNaN)) return false; const s1 = [...a].sort((p, q) => p - q), s2 = [...vals].sort((p, q) => p - q); return s1.every((v, i) => Math.abs(v - s2[i]) < 1e-9); };
const isList = vals => raw => { const a = parseList(raw); return a.length === vals.length && a.every((v, i) => Math.abs(v - vals[i]) < 1e-9); };
const polyN = s => nrm(s).replace(/\*/g, '').replace(/\^2|²/g, '²').replace(/\^3|³/g, '³').replace(/\+-/g, '-').replace(/^\+/, '');
const isPoly = list => raw => list.map(polyN).includes(polyN(raw));
const cxN = s => nrm(s).replace(/\*/g, '').replace(/(^|[+-])1i/g, '$1i').replace(/^0\+/, '').replace(/^0-/, '-').replace(/\+-/g, '-');
const isCx = list => raw => list.map(cxN).includes(cxN(raw));
const ivN = s => nrm(s).replace(/infinity|inf/g, '∞').replace(/[∪u]/g, 'U').replace(/\+∞/g, '∞');
const isIv = list => raw => list.map(ivN).includes(ivN(raw));
const isWord = list => raw => list.map(nrm).includes(nrm(raw));

/* ================== LEARNING MISSIONS v2: content ==================
   Step shape: t (title), v (example visual), cap (caption), x (explanation, shown UNDER the visual),
   words (definitions), level (guided | faded | solo), rem (method reminder: never the answer),
   task (practice that uses DIFFERENT numbers from the example). */
const fP = (f, o) => miniGraph(Object.assign({ fn: f }, o));
const ENDK = { uu: 'left up · right up', dd: 'left down · right down', du: 'left down · right up', ud: 'left up · right down' };
// order: a fixed option order per drill, never the example panels' order (uu, dd, du, ud)
function endDrill(p, a, n, order) {
  const key = endsKey(a, n), par = n % 2 ? 'odd' : 'even';
  const why = k => {
    if (k === key) return `Yes. Degree ${n} is ${par}, so the ends point ${n % 2 ? 'opposite ways' : 'the same way'}, and the ${a > 0 ? 'positive' : 'negative'} leading coefficient sends the right end ${a > 0 ? 'up' : 'down'}.`;
    const same = k === 'uu' || k === 'dd';
    if (same !== (n % 2 === 0)) return `Look at the leading term first. Its degree is ${n}, which is ${par}: ${n % 2 ? 'the ends point opposite ways' : 'both ends point the same way'}.`;
    return `The ${par} part is right. Now use the sign: the leading coefficient is ${a > 0 ? 'positive' : 'negative'}, so the right end points ${a > 0 ? 'up' : 'down'}.`;
  };
  return { p, fixed: true, opts: order.map(k => ({ h: `<span class="end-opt">${endsSvg(k)}<span>${ENDK[k]}</span></span>`, ok: k === key, why: why(k) })) };
}
function haDrill(p, right, rightWhy, others) {
  return { p, opts: [{ h: right, ok: true, why: 'Yes. ' + rightWhy }, ...others.map(([h, why]) => ({ h, why }))] };
}
