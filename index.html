     errs: [[isNum(5), 'That is the degree. Subtract 1.'], [isNum(3), 'Use the degree, not the number of terms.'], [isNum(2), 'Start from the highest exponent, 5.']],
     hints: ['What is the degree?', 'Subtract 1 from the degree.'],
     worked: 'Degree 5, so at most 5 − 1 = 4 turning points.' } },

 { t: 'The y-intercept: where the ride starts', ex: 'f(x) = (x + 2)(x − 3)', level: 'faded',
   v: () => `<div class="m-split">${fP(x => (x + 2) * (x - 3), { xmin: -4, xmax: 5, ymin: -8, ymax: 8, zeros: [-2, 3], pts: [{ x: 0, y: -6 }], labels: [{ x: 0, y: -6, t: '(0, −6)', dx: -10, dy: 18, anchor: 'end' }], label: 'Graph of (x + 2)(x − 3) crossing the y-axis at −6' })}${eqChain([['f(0) = (0 + 2)(0 − 3)', 'replace every x with 0'], ['= 2 · (−3)', 'simplify each factor'], ['= −6', 'multiply']])}</div>`,
   cap: 'The blue dot is where the graph crosses the y-axis.',
   x: `<p>The <span class="key">y-intercept</span> is where the graph crosses the vertical axis. That happens at x = 0, so compute f(0).</p><p>Replace every x with 0, simplify each factor, then multiply all the pieces, including any number in front. Apply exponents before multiplying.</p>`,
   rem: 'Substitute 0 for every x. Multiply all the pieces, including the number in front.',
   task: { kind: 'input', q: 'Find the y-intercept f(0) for f(x) = 2(x − 1)(x + 4).', ok: isNum(-8), a: '−8',
     errs: [[isNum(8), 'Check the sign of (0 − 1).'], [isNum(-4), 'Include the 2 in front.'], [isNum(4), 'Include the 2 in front, and check the sign of (0 − 1).']],
     hints: ['(0 − 1) = −1 and (0 + 4) = 4.', 'Multiply 2 · (−1) · 4.'],
     worked: 'f(0) = 2(0 − 1)(0 + 4) = 2 · (−1) · 4 = −8. The graph crosses the y-axis at (0, −8).' } },

 { t: 'Paper transfer: analyze a polynomial', level: 'solo',
   v: () => flow(['Degree: add the exponents on the factors.', 'Zeros: set each factor to 0.', 'Multiplicity: odd crosses, even touches.', 'End behavior: leading term only.', 'y-intercept: compute f(0).']),
   cap: 'The routine to copy onto scratch paper. Try this one without a reminder.',
   x: `<p>You now have every tool for a full analysis. Work on paper first, then type your three results.</p>`,
   task: { kind: 'multi', q: `Analyze f(x) = −(x − 2)${E(2)}(x + 1).`, fields: [
     { lab: 'Degree', ok: isNum(3), a: '3', errs: [[isNum(2), '2 is the largest exponent you can see, but in factored form the factors multiply: x<sup>2</sup> · x = x<sup>3</sup>. Add the exponents: 2 + 1.']], miss: 'In factored form, add the exponents on the factors that contain x (no exponent written means 1). The minus sign in front adds nothing.' },
     { lab: 'The zero where the graph touches', ok: isNum(2), a: '2', errs: [[isNum(-1), 'x = −1 has multiplicity 1 (odd), so the graph crosses there.'], [isNum(-2), 'Check the sign: x − 2 = 0 gives x = 2.']], miss: 'Set each factor to 0 to find the zeros. The graph touches at the zero whose factor has an even exponent.' },
     { lab: 'y-intercept, f(0)', ok: isNum(-4), a: '−4', errs: [[isNum(4), 'Keep the negative sign in front: −(4)(1).'], [isNum(-2), 'Square (0 − 2) before multiplying.']], miss: 'Substitute 0 for every x. Square (0 − 2) before multiplying, and keep the minus sign in front.' }],
     hints: ['Degree: 2 + 1. Touching happens at the zero with an even exponent.', 'f(0) = −(0 − 2)<sup>2</sup>(0 + 1). Square first.'],
     worked: 'Degree 2 + 1 = 3. Zeros 2 (multiplicity 2, touches) and −1 (multiplicity 1, crosses). f(0) = −(4)(1) = −4. Leading term −x<sup>3</sup>: left up, right down.' } }
]},
/* ------------------------------------------------ 3.2 ------------------------------------------------ */
{ id: '3.2', name: 'Number Machine', subtitle: 'Synthetic division, Remainder and Factor Theorems, rational zeros', icon: '⚙️', ride: 5, steps: [
 { t: 'Division words', level: 'guided',
   v: () => `<div class="m-stack"><div class="m-div"><span class="m-dp"><b>17</b><small>dividend</small></span><span class="m-dop">÷</span><span class="m-dp"><b>5</b><small>divisor</small></span><span class="m-dop">=</span><span class="m-dp"><b>3</b><small>quotient</small></span><span class="m-dop">R</span><span class="m-dp"><b>2</b><small>remainder</small></span></div>${chips(['check: 5 × 3 + 2 = 17'])}<div class="m-div"><span class="m-dp"><b>f(x)</b><small>dividend</small></span><span class="m-dop">÷</span><span class="m-dp"><b>(x − c)</b><small>divisor</small></span><span class="m-dop">=</span><span class="m-dp"><b>q(x)</b><small>quotient</small></span><span class="m-dop">R</span><span class="m-dp"><b>r</b><small>remainder</small></span></div></div>`,
   cap: 'Same four parts for numbers and for polynomials.',
   x: `<p>Every division has four parts. The <span class="key">dividend</span> is what you divide. The <span class="key">divisor</span> is what you divide by. The <span class="key">quotient</span> is the main result, and the <span class="key">remainder</span> is what is left over.</p><p>Synthetic division is a shortcut for dividing a polynomial by a divisor of the form (x − c).</p>`,
   words: [['dividend', 'the amount being divided'], ['divisor', 'what you divide by'], ['quotient', 'the result'], ['remainder', 'what is left over']],
   rem: 'Dividend ÷ divisor = quotient, with a remainder left over.',
   task: { kind: 'input', q: 'In 23 ÷ 4 = 5 remainder 3, which number is the divisor?', ok: isNum(4), a: '4',
     errs: [[isNum(23), '23 is the dividend, the amount being divided.'], [isNum(5), '5 is the quotient, the result.'], [isNum(3), '3 is the remainder.']],
     hints: ['The divisor is the number you divide by.'], worked: '4 is the divisor: 23 is divided by 4.' } },

 { t: 'The top row: coefficients with placeholders', ex: '2x<sup>4</sup> + 3x<sup>2</sup> − x + 6', level: 'guided',
   v: () => `<div class="math-table m-mtable" style="grid-template-columns:repeat(5,minmax(0,1fr))" aria-label="Coefficient columns"><div class="cell head">x<sup>4</sup></div><div class="cell head">x<sup>3</sup></div><div class="cell head">x<sup>2</sup></div><div class="cell head">x</div><div class="cell head">number</div><div class="cell">2</div><div class="cell blank">0</div><div class="cell">3</div><div class="cell">−1</div><div class="cell">6</div></div>${chips(['top row: 2, 0, 3, −1, 6'])}`,
   cap: 'The dashed cell is a placeholder.',
   x: `<p>Write one column for every power, from the highest down to the constant. Put each coefficient, with its sign, in its column.</p><p>This example has no x<sup>3</sup> term, so its column gets a <span class="key">0 placeholder</span>. Without it, every later number would slide into the wrong column.</p>`,
   words: [['placeholder', 'a 0 that holds the spot of a missing power']],
   rem: 'One column per power, highest first. A missing power gets 0. Keep each sign.',
   task: { kind: 'input', q: `Type the top row for x${E(3)} − 5x + 4, in order, separated by commas.`, ok: isList([1, 0, -5, 4]), a: '1, 0, −5, 4', ph: 'for example: 2, 0, 3',
     errs: [[isList([1, -5, 4]), 'There is no x<sup>2</sup> term. Its column needs a 0.'], [isList([4, -5, 0, 1]), 'Start with the highest power, x<sup>3</sup>.'], [isList([1, 0, 5, 4]), 'Keep the sign of −5x.'], [isList([0, 1, 0, -5, 4]), 'Start at the highest power that appears, x<sup>3</sup>.']],
     hints: ['Make columns for x<sup>3</sup>, x<sup>2</sup>, x, and the constant.', 'x<sup>3</sup> has coefficient 1. Which column is empty?'],
     worked: 'Columns x<sup>3</sup>, x<sup>2</sup>, x, constant: 1, 0, −5, 4.' } },

 { t: 'The number in the box', level: 'guided',
   v: () => panels([
     { h: 'Divide by (x − 4)', body: eqChain([['x − 4 = 0', 'set the divisor to 0'], ['x = 4', 'box number']]) + `<span class="m-boxnum">4</span>` },
     { h: 'Divide by (x + 1)', body: eqChain([['x + 1 = 0', 'set the divisor to 0'], ['x = −1', 'box number']]) + `<span class="m-boxnum">−1</span>` }]),
   cap: 'Two examples: one minus divisor and one plus divisor.',
   x: `<p>Synthetic division uses one number, <span class="key">c</span>, in the box on the left. Find it by setting the divisor equal to 0.</p><p>That is the same move as finding a zero, so the sign flips: (x − 4) gives 4, and (x + 1) gives −1.</p>`,
   rem: 'Set the divisor equal to 0 and solve. That value goes in the box.',
   task: { kind: 'input', q: 'You are dividing by (x + 5). What number goes in the box?', ok: isNum(-5), a: '−5',
     errs: [[isNum(5), 'Solve x + 5 = 0. Subtracting 5 gives a negative number.']], hints: ['Write x + 5 = 0.', 'Subtract 5 from both sides.'], worked: 'x + 5 = 0 gives x = −5, so −5 goes in the box.' } },

 { t: 'Bring down, multiply, add', ex: '(2x<sup>3</sup> − 5x<sup>2</sup> + x − 4) ÷ (x − 2)', level: 'guided',
   v: () => synthStepper([2, -5, 1, -4], 2),
   cap: 'Step through every move.',
   x: `<p>The machine repeats one pattern. <span class="key">Bring down</span> the first coefficient. <span class="key">Multiply</span> the newest bottom number by the box number and write the product in the next column. <span class="key">Add</span> that column. Then multiply and add again until the columns run out.</p><p>In the table, the "× 2" row holds the products and the "sum" row holds the sums.</p>`,
   rem: 'Bring down the first number. Then repeat: multiply by the box number, write it in the next column, add the column.',
   task: { kind: 'synth', q: `Now run the machine yourself: (x${E(3)} + 2x${E(2)} − 5x + 1) ÷ (x − 1).`, cs: [1, 2, -5, 1], c: 1,
     worked: 'Bottom row 1, 3, −2 | −1. Quotient x<sup>2</sup> + 3x − 2, remainder −1.' } },

 { t: 'Read the bottom row', ex: '(2x<sup>3</sup> − 5x<sup>2</sup> + x − 4) ÷ (x − 2)', level: 'guided',
   v: () => `<div class="m-stack">${synthTable([2, -5, 1, -4], 2)}${chips(['2, −1, −1 → quotient <b>2x<sup>2</sup> − x − 1</b>', 'last number −6 → <b>remainder</b>'])}</div>`,
   cap: 'The finished table from the last step.',
   x: `<p>The <span class="key">last</span> number in the bottom row is the remainder. The numbers before it are the quotient's coefficients.</p><p>The quotient starts <span class="key">one power lower</span> than the dividend. Dividing a degree-3 polynomial gives a degree-2 quotient. A 0 in the bottom row keeps its column, so that power is simply missing.</p>`,
   rem: 'Last number: remainder. The rest: quotient coefficients, starting one power below the original.',
   task: { kind: 'choice', q: 'A degree-4 polynomial divided by (x − c) ends with the bottom row 3, 0, −2, 1 | 5. What is the quotient?', opts: [
     { h: `3x${E(3)} − 2x + 1`, ok: true, why: 'Yes. Degree 4 drops to degree 3: 3x<sup>3</sup> + 0x<sup>2</sup> − 2x + 1.' },
     { h: `3x${E(4)} − 2x${E(2)} + x`, why: 'The quotient starts one power lower than the original. A degree-4 dividend gives a degree-3 quotient.' },
     { h: `3x${E(3)} − 2x${E(2)} + 1`, why: 'The 0 holds the x<sup>2</sup> place. Give each number its own power: 3x<sup>3</sup> + 0x<sup>2</sup> − 2x + 1.' },
     { h: `3x${E(3)} − 2x + 6`, why: '5 is the remainder. It is not added to the quotient.' }],
     worked: 'Powers 3, 2, 1, 0 for 3, 0, −2, 1: quotient 3x<sup>3</sup> − 2x + 1, remainder 5.' } },

 { t: 'The Remainder Theorem', ex: 'f(x) = 2x<sup>3</sup> − 5x<sup>2</sup> + x − 4, divided by (x − 2)', level: 'faded',
   v: () => panels([
     { h: 'Route 1: divide', body: synthTable([2, -5, 1, -4], 2), note: 'remainder <b>−6</b>' },
     { h: 'Route 2: substitute', body: eqChain([['f(2) = 2(2)<sup>3</sup> − 5(2)<sup>2</sup> + 2 − 4', ''], ['= 16 − 20 + 2 − 4', ''], ['= −6', '']]), note: 'f(2) = <b>−6</b>' }]),
   cap: 'Both routes give −6.',
   x: `<p>The <span class="key">Remainder Theorem</span>: when f(x) is divided by (x − c), the remainder equals <span class="key">f(c)</span>.</p><p>So you can find a remainder by substituting c, or find f(c) by synthetic division. Use whichever is faster; they always agree.</p>`,
   rem: 'Find c from the divisor (sign flips). The remainder is f(c).',
   task: { kind: 'input', q: `f(x) = x${E(3)} − 2x + 7. What is the remainder when f is divided by (x + 2)?`, ok: isNum(3), a: '3',
     errs: [[isNum(11), 'That is f(2). The divisor (x + 2) means c = −2.'], [isNum(-3), 'Recheck the signs: (−2)<sup>3</sup> = −8 and −2(−2) = +4.'], [isNum(7), 'Substitute c for every x, not only the constant.']],
     hints: ['Set x + 2 = 0 to find c.', 'Compute f(−2) = (−2)<sup>3</sup> − 2(−2) + 7 one piece at a time.'],
     worked: 'c = −2. f(−2) = −8 + 4 + 7 = 3. The remainder is 3.' } },

 { t: 'The Factor Theorem', ex: '(x<sup>3</sup> − 4x<sup>2</sup> + 2x + 3) ÷ (x − 3)', level: 'faded',
   v: () => `<div class="m-stack">${synthTable([1, -4, 2, 3], 3)}${chips(['remainder <b>0</b>', 'so f(3) = 0', 'so (x − 3) is a factor'])}${eqChain([['f(x) = (x − 3)(x<sup>2</sup> − x − 1)', 'divisor × quotient']])}</div>`,
   x: `<p>The <span class="key">Factor Theorem</span>: (x − c) is a factor of f exactly when f(c) = 0. A remainder of 0 means the division comes out even.</p><p>Then f(x) = (x − c) · q(x), and c is a zero of f. A nonzero remainder means (x − c) is not a factor.</p>`,
   rem: 'Find c. If f(c) = 0 (remainder 0), then (x − c) is a factor. Remember 0 placeholders.',
   task: { kind: 'choice', q: `Is (x − 2) a factor of f(x) = x${E(3)} − 3x${E(2)} + 4?`, opts: [
     { h: 'Yes', ok: true, why: 'Yes. f(2) = 8 − 12 + 4 = 0, so the remainder is 0.' },
     { h: 'No', why: 'Test it: compute f(2) = 2<sup>3</sup> − 3(2)<sup>2</sup> + 4. A result of 0 means it is a factor.' }],
     hints: ['Find f(2), or divide with top row 1, −3, 0, 4.'],
     worked: 'f(2) = 8 − 12 + 4 = 0. The remainder is 0, so (x − 2) is a factor.' } },

 { t: 'Rational Zero Theorem: the candidate list', ex: 'f(x) = 2x<sup>3</sup> + x<sup>2</sup> − 7x − 6', level: 'faded',
   v: () => `<div class="m-stack">${chips(['p: factors of the constant 6 → 1, 2, 3, 6', 'q: factors of the leading coefficient 2 → 1, 2'])}<div class="m-pq"><span>±1/1</span><span>±2/1</span><span>±3/1</span><span>±6/1</span><span>±1/2</span><s>±2/2</s><span>±3/2</span><s>±6/2</s></div>${chips(['candidates: ±1, ±2, ±3, ±6, ±1/2, ±3/2'])}</div>`,
   cap: 'Crossed-out fractions repeat earlier values.',
   x: `<p>If f has integer coefficients, every <span class="key">rational zero</span> has the form <span class="key">± p/q</span>, where p is a factor of the constant term and q is a factor of the leading coefficient.</p><p>This gives a list of <span class="key">candidates</span>. A candidate is only a suspect: test it before calling it a zero.</p>`,
   words: [['candidate', 'a number that might be a zero and still needs testing']],
   rem: 'Candidates = ± (factor of the constant) ÷ (factor of the leading coefficient). Drop repeats.',
   task: { kind: 'choice', q: `For f(x) = 3x${E(3)} − x + 4, which number is NOT a possible rational zero?`, opts: [
     { h: '3/4', ok: true, why: 'Yes. Its q is 4, which does not divide the leading coefficient 3. (Its p, 3, also fails to divide 4.)' },
     { h: '4/3', why: '4 divides the constant 4, and 3 divides the leading coefficient 3, so 4/3 is a candidate.' },
     { h: '2/3', why: '2 divides 4, and 3 divides 3, so 2/3 is a candidate.' },
     { h: '−1', why: '±1 is always a candidate, because 1 divides every integer.' }],
     worked: 'p: 1, 2, 4. q: 1, 3. Candidates: ±1, ±2, ±4, ±1/3, ±2/3, ±4/3. 3/4 is not on the list.' } },

 { t: 'Test a candidate, then shrink', ex: 'f(x) = x<sup>3</sup> − 7x − 6', level: 'solo',
   v: () => `<div class="m-stack">${flow(['Candidates for x<sup>3</sup> − 7x − 6: ±1, ±2, ±3, ±6.', 'Test −1 with top row 1, 0, −7, −6: bottom row 1, −1, −6 | 0.', 'Remainder 0, so −1 is a zero. Quotient: x<sup>2</sup> − x − 6.', 'Factor the quotient: (x − 3)(x + 2).', 'All zeros: −2, −1, 3.'])}</div>`,
   x: `<p>Once a test gives remainder 0, keep working with the smaller <span class="key">quotient</span>. When it shrinks to a quadratic, factor it or use the quadratic formula.</p>`,
   task: { kind: 'input', q: `f(x) = x${E(3)} + 2x${E(2)} − 5x − 6, and −1 is a zero. Find all three zeros, separated by commas.`, ok: isSet([-3, -1, 2]), a: '−3, −1, 2', ph: 'three numbers',
     errs: [[isSet([3, 1, -2]), 'Each sign is flipped. Set each factor equal to 0.'], [isSet([-3, 2]), 'Include the zero you were given, −1.'], [r => parseList(r).length !== 3, 'A degree-3 polynomial needs three zeros here.']],
     hints: ['Divide by (x + 1): top row 1, 2, −5, −6 with −1 in the box.', 'The quotient is a quadratic. Factor it.'],
     worked: 'Synthetic division with −1 gives 1, 1, −6 | 0, so the quotient is x<sup>2</sup> + x − 6 = (x + 3)(x − 2). Zeros: −3, −1, 2.' } }
]},
/* ------------------------------------------------ 3.3 ------------------------------------------------ */
{ id: '3.3', name: 'Mirror Room', subtitle: 'Complex numbers, conjugate pairs, the Fundamental Theorem of Algebra', icon: '🪞', ride: 7, steps: [
 { t: 'Meet i', ex: '(5i)<sup>2</sup>', level: 'guided',
   v: () => `<div class="m-stack">${chips(['(−2)<sup>2</sup> = 4', '0<sup>2</sup> = 0', '3<sup>2</sup> = 9'])}<p class="m-rowlab">No real number squares to a negative, so we define a new number:</p>${chips(['<b>i<sup>2</sup> = −1</b>'])}${eqChain([['(5i)<sup>2</sup> = 25 · i<sup>2</sup>', 'square each part'], ['= 25 · (−1)', 'replace i<sup>2</sup> with −1'], ['= −25', '']])}</div>`,
   x: `<p>Squares of real numbers are never negative, so x<sup>2</sup> = −1 has no real solution. Mathematicians define the <span class="key">imaginary unit i</span> by <span class="key">i<sup>2</sup> = −1</span>.</p><p>Whenever i<sup>2</sup> appears, replace it with −1.</p>`,
   words: [['i', 'the number with i<sup>2</sup> = −1']],
   rem: 'Square each part separately, then replace i<sup>2</sup> with −1.',
   task: { kind: 'input', q: 'Simplify (3i)<sup>2</sup>.', ok: isNum(-9), a: '−9',
     errs: [[isNum(9), 'i<sup>2</sup> = −1, so the result changes sign.'], [isWord(['9i', '-9i']), '(3i)<sup>2</sup> = 9 · i<sup>2</sup>, and i<sup>2</sup> is the real number −1. No i remains.'], [isNum(6), 'Square the 3: 3 · 3.']],
     hints: ['(3i)<sup>2</sup> = 3<sup>2</sup> · i<sup>2</sup>.', 'Replace i<sup>2</sup> with −1.'], worked: '(3i)<sup>2</sup> = 9 · i<sup>2</sup> = 9 · (−1) = −9.' } },

 { t: 'Square roots of negative numbers', ex: '√(−49)', level: 'guided',
   v: () => eqChain([['√(−49)', ''], ['= √49 · √(−1)', 'split off the −1'], ['= 7 · i', '√49 = 7 and √(−1) = i'], ['= 7i', '']]),
   x: `<p>To simplify the square root of a negative number, split it into √(positive) · √(−1). Then use <span class="key">√(−1) = i</span>.</p>`,
   rem: 'Write √(−n) as √n · i. Simplify √n, then attach i.',
   task: { kind: 'input', q: 'Simplify √(−36). Type your answer using i.', ok: isCx(['6i']), a: '6i', ph: 'for example: 5i',
     errs: [[isNum(6), 'Keep the i: it comes from √(−1).'], [isNum(-6), 'The square root of −36 is not −6; (−6)<sup>2</sup> = 36. Use i.'], [isCx(['-6i']), 'The principal square root uses +i: √(−36) = 6i.'], [isCx(['36i']), 'Take the square root of 36.']],
     hints: ['√(−36) = √36 · √(−1).'], worked: '√(−36) = √36 · √(−1) = 6i.' } },

 { t: 'Complex numbers on their own plane', ex: '3 + 2i', level: 'guided',
   v: () => complexPlane({ R: 4, pts: [{ a: 3, b: 2, t: '3 + 2i', proj: true }], label: 'Complex plane with the point 3 + 2i' }),
   cap: '3 steps along the real axis and 2 steps up the imaginary axis.',
   x: `<p>A <span class="key">complex number</span> has the form a + bi. The <span class="key">real part</span> is a, and the <span class="key">imaginary part</span> is b.</p><p>We picture complex numbers on the <span class="key">complex plane</span>: real part across, imaginary part up. This is a separate picture from the graph of f(x). Nonreal numbers never appear as x-intercepts on a polynomial's graph.</p>`,
   words: [['real part', 'a in a + bi'], ['imaginary part', 'b in a + bi (the number multiplying i)']],
   rem: 'In a + bi, the real part is the number without i. The imaginary part is the number multiplying i.',
   task: { kind: 'input', q: 'In −4 + 9i, what is the real part?', ok: isNum(-4), a: '−4',
     errs: [[isNum(9), '9 multiplies i, so 9 is the imaginary part.'], [isNum(4), 'Keep the sign: the real part is negative.']],
     hints: ['The real part is the term without i.'], worked: 'The real part is −4. The imaginary part is 9.' } },

 { t: 'The conjugate: a mirror image', ex: '3 + 2i and 3 − 2i', level: 'guided',
   v: () => complexPlane({ R: 4, mirror: true, pts: [{ a: 3, b: 2, t: '3 + 2i' }, { a: 3, b: -2, t: '3 − 2i' }], pairs: [[[3, 2], [3, -2]]], label: 'The points 3 + 2i and 3 − 2i reflected across the real axis' }),
   cap: 'The real axis (gold dashes) is the mirror.',
   x: `<p>The <span class="key">conjugate</span> of a + bi is a − bi. The real part stays the same; only the sign of the imaginary part flips.</p><p>On the complex plane, conjugates are reflections of each other across the real axis.</p>`,
   words: [['conjugate', 'a + bi and a − bi: same real part, opposite imaginary part']],
   rem: 'Keep the real part. Flip only the sign in front of the i term.',
   task: { kind: 'input', q: 'Type the conjugate of −1 + 6i.', ok: isCx(['-1-6i']), a: '−1 − 6i', ph: 'a + bi form',
     errs: [[isCx(['1-6i']), 'Keep the real part, −1, exactly as it is.'], [isCx(['-1+6i']), 'That is the same number. Flip the sign of the i term.'], [isCx(['1+6i']), 'Only the i part changes sign. The real part stays −1.']],
     hints: ['The real part −1 stays.', 'Change +6i to −6i.'], worked: 'The conjugate of −1 + 6i is −1 − 6i.' } },

 { t: 'Nonreal zeros come in pairs', ex: 'zeros 2 − 5i, i, and 7', level: 'guided',
   v: () => `<div class="m-pairs"><div class="m-pairrow"><span>2 − 5i</span><span class="eqarrow">↔</span><span>2 + 5i</span></div><div class="m-pairrow"><span>i</span><span class="eqarrow">↔</span><span>−i</span></div><div class="m-pairrow single"><span>7</span><span class="m-why">real: no partner needed</span></div></div>`,
   cap: 'A polynomial with real coefficients.',
   x: `<p>The <span class="key">Conjugate Pairs Theorem</span>: if a polynomial has <span class="key">real coefficients</span> and a + bi is a zero, then a − bi is also a zero.</p><p>Real zeros do not need a partner. Only nonreal zeros come in pairs.</p>`,
   rem: 'Every nonreal zero brings its conjugate. Real zeros stand alone.',
   task: { kind: 'choice', q: 'A polynomial with real coefficients has the zeros 4 and −3i. Which other number must also be a zero?', opts: [
     { h: '3i', ok: true, why: 'Yes. −3i = 0 − 3i, and its conjugate is 0 + 3i = 3i.' },
     { h: '−4', why: 'Real zeros, like 4, do not need a partner.' },
     { h: '4 + 3i', why: 'The real part of −3i is 0, so the partner keeps a real part of 0.' },
     { h: '−3', why: 'Keep the i. Only its sign flips.' }],
     worked: 'The nonreal zero −3i needs its conjugate 3i. The real zero 4 needs no partner.' } },

 { t: 'Counting every zero', ex: 'f(x) = (x − 1)(x + 2)(x<sup>2</sup> + 9)', level: 'faded',
   v: () => panels([
     { h: 'Graph of f', sub: 'only real zeros appear', body: fP(x => (x - 1) * (x + 2) * (x * x + 9), { xmin: -3, xmax: 2, ymin: -30, ymax: 40, zeros: [-2, 1], w: 260, h: 200, cls: 'vx-panel', label: 'Graph meeting the x-axis at −2 and 1 only' }), note: 'x-intercepts: −2 and 1' },
     { h: 'Complex plane', sub: 'all four zeros', body: complexPlane({ R: 4, w: 260, h: 220, pts: [{ a: -2, b: 0, t: '−2', real: true, dx: -8, dy: -10, anchor: 'end' }, { a: 1, b: 0, t: '1', real: true, dx: 8, dy: -10 }, { a: 0, b: 3, t: '3i', dx: 10, dy: 5 }, { a: 0, b: -3, t: '−3i', dx: 10, dy: 5 }], label: 'Complex plane showing zeros −2, 1, 3i, and −3i' }), note: '3i and −3i are not on the x-axis' }]),
   cap: 'Degree 4, so 4 zeros in all.',
   x: `<p>The <span class="key">Fundamental Theorem of Algebra</span> says a polynomial of degree n has exactly <span class="key">n complex zeros</span>, counting multiplicity. "Complex" includes the real numbers.</p><p>The graph of f shows only the real zeros. Here the factor x<sup>2</sup> + 9 gives 3i and −3i, which never touch the x-axis.</p>`,
   rem: 'Total zeros = degree. Nonreal zeros = degree − real zeros, and they come in pairs.',
   task: { kind: 'input', q: 'A degree-5 polynomial with real coefficients has exactly 3 real zeros (counting multiplicity). How many nonreal zeros does it have?', ok: isNum(2), a: '2',
     errs: [[isNum(5), 'That is the total number of zeros. Subtract the real ones.'], [isNum(3), 'That is the real count. How many are left of the 5?'], [isNum(0), 'Degree 5 means 5 zeros in all.']],
     hints: ['Degree 5 means 5 zeros in all.'], worked: '5 total − 3 real = 2 nonreal zeros: one conjugate pair.' } },

 { t: 'A conjugate pair makes a real quadratic', ex: '(x − 2i)(x + 2i)', level: 'faded',
   v: () => eqChain([['(x − 2i)(x + 2i)', 'a conjugate pair of factors'], ['= x<sup>2</sup> + 2ix − 2ix − 4i<sup>2</sup>', 'multiply every pair of terms'], ['= x<sup>2</sup> − 4(−1)', 'middle terms cancel; i<sup>2</sup> = −1'], ['= x<sup>2</sup> + 4', 'no i remains']]),
   cap: 'The zeros are 2i and −2i.',
   x: `<p>Multiplying the two factors of a conjugate pair always removes i. The middle terms cancel, and i<sup>2</sup> = −1 turns the last term positive.</p><p>Shortcut: <span class="key">(x − bi)(x + bi) = x<sup>2</sup> + b<sup>2</sup></span>.</p>`,
   rem: 'Multiply term by term. The middle terms cancel. Replace i<sup>2</sup> with −1.',
   task: { kind: 'input', q: 'Multiply (x − 5i)(x + 5i). Type the result.', ok: isPoly(['x²+25', '25+x²']), a: 'x<sup>2</sup> + 25', ph: 'use x^2 for x squared',
     errs: [[isPoly(['x²-25']), 'Replace i<sup>2</sup> with −1: −25i<sup>2</sup> = +25.'], [isPoly(['x²+5']), 'Square the 5.'], [isPoly(['x²+10x+25', 'x²-10x+25']), 'The middle terms are +5ix and −5ix. They cancel.']],
     hints: ['Multiply out: x<sup>2</sup> + 5ix − 5ix − 25i<sup>2</sup>.', 'Replace i<sup>2</sup> with −1.'], worked: 'x<sup>2</sup> + 5ix − 5ix − 25i<sup>2</sup> = x<sup>2</sup> − 25(−1) = x<sup>2</sup> + 25.' } },

 { t: 'Use a given zero to find the rest', ex: 'f(x) = x<sup>3</sup> − 4x<sup>2</sup> + 49x − 196, zero −7i', level: 'faded',
   v: () => flow(['Given: f(x) = x<sup>3</sup> − 4x<sup>2</sup> + 49x − 196 has the zero −7i.', 'Its partner 7i is also a zero.', 'Multiply the pair: (x − 7i)(x + 7i) = x<sup>2</sup> + 49.', 'Divide (or group): f(x) = (x<sup>2</sup> + 49)(x − 4).', 'All zeros: 4, 7i, −7i.']),
   cap: 'From your notes.',
   x: `<p>A given nonreal zero hands you a second zero for free: its conjugate. Multiply that pair into a real quadratic, then divide f by it. The quotient holds the remaining zeros.</p><p>Grouping can replace the division: x<sup>3</sup> − 4x<sup>2</sup> + 49x − 196 = x<sup>2</sup>(x − 4) + 49(x − 4).</p>`,
   rem: 'Partner → multiply the pair → divide f by that quadratic → solve what is left.',
   task: { kind: 'input', q: `f(x) = x${E(3)} + 2x${E(2)} + 9x + 18 has the zero 3i. What is its real zero?`, ok: isNum(-2), a: '−2',
     errs: [[isNum(2), 'The leftover factor is (x + 2). Set it equal to 0.'], [isCx(['-3i', '3i']), 'That is a nonreal zero. The question asks for the real one.'], [isNum(9), '9 comes from the quadratic x<sup>2</sup> + 9, not a zero.']],
     hints: ['The pair 3i and −3i gives x<sup>2</sup> + 9.', 'Group: x<sup>2</sup>(x + 2) + 9(x + 2).'], worked: 'f(x) = x<sup>2</sup>(x + 2) + 9(x + 2) = (x<sup>2</sup> + 9)(x + 2). Real zero: −2. Others: ±3i.' } },

 { t: 'Paper transfer: build a polynomial from zeros', ex: 'zeros −2 and i', level: 'solo',
   v: () => flow(['Zeros −2 and i (real coefficients).', 'Add the partner: −i.', 'Factors: (x + 2)(x − i)(x + i).', 'Pair first: (x − i)(x + i) = x<sup>2</sup> + 1.', 'Multiply out: (x + 2)(x<sup>2</sup> + 1) = x<sup>3</sup> + 2x<sup>2</sup> + x + 2.']),
   cap: 'Worked with different zeros from your problem.',
   x: `<p>Work on paper: list every zero (with partners), write the factors, multiply the conjugate pair first, then multiply out.</p>`,
   task: { kind: 'multi', q: 'Build the degree-3 polynomial with leading coefficient 1, real coefficients, and zeros 1 and 2i. Write it as x<sup>3</sup> + ax<sup>2</sup> + bx + c.', fields: [
     { lab: 'a (coefficient of x<sup>2</sup>)', ok: isNum(-1), a: '−1', errs: [[isNum(1), 'The factor for the zero 1 is (x − 1), which brings a negative.']], miss: 'Multiply the conjugate pair first, then multiply (x − 1) by that quadratic and collect the x<sup>2</sup> terms.' },
     { lab: 'b (coefficient of x)', ok: isNum(4), a: '4', errs: [[isNum(-4), '(x<sup>2</sup> + 4) times x gives +4x.'], [isNum(2), 'Square the 2 in 2i: the pair gives x<sup>2</sup> + 4.']], miss: 'After multiplying out, collect every term that has exactly one x.' },
     { lab: 'c (constant)', ok: isNum(-4), a: '−4', errs: [[isNum(4), 'Multiply the constants: (−1)(4).']], miss: 'The constant is the product of the constants in the factors.' }],
     hints: ['The partner of 2i is −2i, and (x − 2i)(x + 2i) = x<sup>2</sup> + 4.', 'Multiply (x − 1)(x<sup>2</sup> + 4).'],
     worked: '(x − 1)(x<sup>2</sup> + 4) = x<sup>3</sup> − x<sup>2</sup> + 4x − 4. So a = −1, b = 4, c = −4.' } }
]},
/* ------------------------------------------------ 3.4 ------------------------------------------------ */
{ id: '3.4', name: 'Walls & Horizons', subtitle: 'Domain, holes, vertical, horizontal, and slant asymptotes', icon: '🧱', ride: 8, steps: [
 { t: 'Rational functions and their domain', ex: 'R(x) = <span class="frac"><span>x + 1</span><span>x − 3</span></span>', level: 'guided',
   v: () => `<div class="m-split">${fP(x => (x + 1) / (x - 3), { xmin: -4, xmax: 9, ymin: -7, ymax: 9, vas: [3], arrows: false, labels: [{ x: 3, y: 9, t: 'x = 3 not allowed', dx: 8, dy: 16 }], label: 'Graph of (x + 1)/(x − 3) with a dashed wall at x = 3' })}${eqChain([['x − 3 = 0', 'set the denominator to 0'], ['x = 3', 'excluded'], ['Domain: {x | x ≠ 3}', '']])}</div>`,
   x: `<p>A <span class="key">rational function</span> is a fraction with polynomials on top and bottom: R(x) = p(x)/q(x).</p><p>Division by zero is undefined, so the <span class="key">domain</span> leaves out every x that makes the <span class="key">denominator</span> 0. The top may be 0; that only gives an x-intercept.</p>`,
   words: [['rational function', 'one polynomial divided by another'], ['domain', 'every x-value the function accepts']],
   rem: 'Set the denominator equal to 0 and solve. Those x-values are excluded.',
   task: { kind: 'input', q: 'R(x) = 2x/(x + 6). Which x-value is excluded from the domain?', ok: isNum(-6), a: '−6',
     errs: [[isNum(6), 'Solve x + 6 = 0: the sign flips.'], [isNum(0), 'x = 0 makes the top 0, which is allowed. Only the bottom matters.']],
     hints: ['Set the denominator x + 6 equal to 0.'], worked: 'x + 6 = 0 gives x = −6. Domain: {x | x ≠ −6}.' } },

 { t: 'Factor the denominator to find every restriction', ex: 'R(x) = <span class="frac"><span>x</span><span>x<sup>2</sup> − 9</span></span>', level: 'guided',
   v: () => eqChain([['R(x) = x / (x<sup>2</sup> − 9)', ''], ['x<sup>2</sup> − 9 = (x − 3)(x + 3)', 'difference of squares'], ['x − 3 = 0 → x = 3;  x + 3 = 0 → x = −3', 'each factor'], ['Domain: {x | x ≠ −3, x ≠ 3}', '']]),
   x: `<p>A denominator can have several factors. Factor it completely, then exclude the zero of <span class="key">every</span> factor.</p>`,
   rem: 'Factor the bottom completely. Each factor gives one excluded value.',
   task: { kind: 'input', q: `R(x) = 5/(x${E(2)} − x − 12). Type both excluded values, separated by a comma.`, ok: isSet([4, -3]), a: '4, −3', ph: 'two numbers',
     errs: [[isSet([-4, 3]), 'Check the signs: x<sup>2</sup> − x − 12 = (x − 4)(x + 3).'], [r => parseList(r).length === 1, 'The quadratic has two factors, so there are two excluded values.']],
     hints: ['Find two numbers that multiply to −12 and add to −1.', 'x<sup>2</sup> − x − 12 = (x − 4)(x + 3). Set each factor to 0.'],
     worked: 'x<sup>2</sup> − x − 12 = (x − 4)(x + 3). Excluded: 4 and −3.' } },

 { t: 'Hole or wall?', level: 'guided',
   v: () => panels([
     { h: 'Factor cancels: hole', eq: 'H(x) = <span class="frac"><span>x<sup>2</sup> − 1</span><span>x − 1</span></span>', body: fP(x => x + 1, { xmin: -3, xmax: 3, ymin: -2, ymax: 4, holes: [{ x: 1, y: 2 }], arrows: false, w: 260, h: 200, cls: 'vx-panel', labels: [{ x: 1, y: 2, t: 'hole (1, 2)', dx: 10, dy: 16 }], label: 'Line y = x + 1 with an open circle at (1, 2)' }), note: '(x − 1)(x + 1)/(x − 1) = x + 1, but x ≠ 1' },
     { h: 'Factor stays: wall', eq: 'W(x) = <span class="frac"><span>x + 1</span><span>x − 1</span></span>', body: fP(x => (x + 1) / (x - 1), { xmin: -3, xmax: 5, ymin: -6, ymax: 7, vas: [1], arrows: false, w: 260, h: 200, cls: 'vx-panel', labels: [{ x: 1, y: 7, t: 'x = 1', dx: 8, dy: 16 }], label: 'Graph with a vertical asymptote at x = 1' }), note: '(x − 1) stays in the bottom' }]),
   cap: 'Both examples share the denominator factor (x − 1).',
   x: `<p>Factor the top and the bottom. If the same factor appears on both, it <span class="key">cancels</span>: that x is still excluded, but the graph only has a <span class="key">hole</span> (an open circle) there.</p><p>A denominator factor that remains after canceling makes a <span class="key">vertical asymptote</span>: a wall the graph races beside but never crosses.</p>`,
   words: [['hole', 'a single missing point, from a canceled factor'], ['vertical asymptote', 'a wall x = c from a factor left in the bottom']],
   rem: 'Factor top and bottom. Canceled factor → hole. Factor left in the bottom → vertical asymptote.',
   task: { kind: 'input', q: 'R(x) = (x + 5)(x − 2) / [(x − 2)(x + 3)]. At what x-value is the hole?', ok: isNum(2), a: '2',
     errs: [[isNum(-3), '(x + 3) stays in the bottom, so x = −3 is a wall.'], [isNum(-5), 'x = −5 makes the top 0: that is an x-intercept.'], [isNum(-2), 'Check the sign: x − 2 = 0 gives x = 2.']],
     hints: ['Which factor appears on both the top and the bottom?'], worked: '(x − 2) cancels, so there is a hole at x = 2. The wall is x = −3.' } },

 { t: 'Vertical asymptotes come after canceling', ex: 'R(x) = <span class="frac"><span>x − 1</span><span>x<sup>2</sup> + x − 2</span></span>', level: 'faded',
   v: () => `<div class="m-split">${fP(x => 1 / (x + 2), { xmin: -6, xmax: 4, ymin: -5, ymax: 5, vas: [-2], holes: [{ x: 1, y: 1 / 3 }], arrows: false, labels: [{ x: -2, y: 5, t: 'x = −2', dx: 8, dy: 16 }, { x: 1, y: 1 / 3, t: 'hole at x = 1', dx: 8, dy: -10 }], label: 'Graph of 1/(x + 2) with a wall at −2 and a hole at x = 1' })}${eqChain([['(x − 1) / (x<sup>2</sup> + x − 2)', ''], ['= (x − 1) / [(x − 1)(x + 2)]', 'factor'], ['= 1/(x + 2), x ≠ 1', 'cancel'], ['wall: x = −2', 'what is left in the bottom']])}</div>`,
   x: `<p>Only the factors that <span class="key">remain</span> in the denominator after canceling make vertical asymptotes. A factor that cancels makes a hole instead, even though that x is still excluded from the domain.</p>`,
   rem: 'Factor, cancel, then read the remaining bottom factors for walls.',
   task: { kind: 'input', q: `R(x) = (x + 2)/(x${E(2)} − 4). Where is the vertical asymptote? Type the x-value.`, ok: isNum(2), a: '2',
     errs: [[isNum(-2), '(x + 2) cancels with the top, so x = −2 is a hole.'], [isNum(4), 'Factor x<sup>2</sup> − 4 first.']],
     hints: ['x<sup>2</sup> − 4 = (x − 2)(x + 2).', 'Cancel the shared factor. What stays in the bottom?'], worked: '(x + 2)/[(x − 2)(x + 2)] = 1/(x − 2) with x ≠ −2. Wall at x = 2, hole at x = −2.' } },

 { t: 'Horizontal asymptotes: compare the degrees', level: 'faded',
   v: () => `<div class="m-panels m-panels-3">${[
     ['Top degree smaller', 'y = 0', x => 2 * x / (x * x + 1), { ha: 0, xmin: -6, xmax: 6, ymin: -2, ymax: 2 }, 'R(x) = <span class="frac"><span>2x</span><span>x<sup>2</sup> + 1</span></span>'],
     ['Degrees equal', 'y = 3 (top lead ÷ bottom lead)', x => (3 * x - 1) / (x + 2), { ha: 3, vas: [-2], xmin: -8, xmax: 6, ymin: -6, ymax: 12 }, 'R(x) = <span class="frac"><span>3x − 1</span><span>x + 2</span></span>'],
     ['Top degree bigger', 'no horizontal asymptote', x => x * x / (x - 1), { vas: [1], xmin: -5, xmax: 6, ymin: -8, ymax: 12 }, 'R(x) = <span class="frac"><span>x<sup>2</sup></span><span>x − 1</span></span>']
   ].map(([h, sub, f, o, note]) => `<div class="m-panel"><p class="m-panel-h">${h}</p><p class="m-panel-eq">${note}</p><p class="m-panel-sub">${sub}</p>${fP(f, Object.assign({ w: 240, h: 170, arrows: false, cls: 'vx-panel', label: h, step: 2 }, o))}</div>`).join('')}</div>`,
   cap: 'Gold dashes mark the asymptotes.',
   x: `<p>Far to the left and right, a rational graph may level off along a <span class="key">horizontal asymptote</span>. Compare the degree of the top (n) with the degree of the bottom (m).</p><p><span class="key">n &lt; m</span>: y = 0. <span class="key">n = m</span>: y = (leading coefficient of top) ÷ (leading coefficient of bottom). <span class="key">n &gt; m</span>: no horizontal asymptote.</p>`,
   rem: 'Compare degrees. Smaller top: y = 0. Equal: divide leading coefficients. Bigger top: none.',
   task: { kind: 'input', q: `R(x) = (8x${E(2)} − 1)/(2x${E(2)} + x + 5). The horizontal asymptote is y = ?`, ok: isNum(4), a: '4',
     errs: [[isNum(0), 'y = 0 needs the bottom degree to be larger. These degrees are equal.'], [isNum(8), 'Divide by the bottom leading coefficient, 2.'], [isNum(0.25), 'Divide top by bottom: 8 ÷ 2.']],
     hints: ['Both degrees are 2.', 'Divide the leading coefficients.'], worked: 'Degrees are equal (2 and 2), so y = 8/2 = 4.' } },

 { t: 'Horizon drills', level: 'faded',
   v: () => `<div class="m-rules"><div><b>n &lt; m</b><span>y = 0</span></div><div><b>n = m</b><span>y = ratio of leading coefficients</span></div><div><b>n &gt; m</b><span>no horizontal asymptote</span></div></div>`,
   cap: 'The three cases from the last step, as a quick reference.',
   x: `<p>Practice choosing the case quickly. Find each degree first, then decide.</p>`,
   rem: 'Degree of the top vs degree of the bottom decides the case.',
   task: { kind: 'drills', q: 'Pick the horizontal asymptote for each function.', items: [
     haDrill(`R(x) = (5x${E(3)} + 2)/(x${E(2)} − 1)`, 'No horizontal asymptote', 'The top has degree 3 and the bottom has degree 2. A bigger top never levels off.', [['y = 0', 'y = 0 needs the bottom degree to be bigger. Here the top is bigger (3 vs 2).'], ['y = 5', 'Dividing leading coefficients only works when the degrees are equal. Here they are 3 and 2.'], ['y = 5/2', 'Only equal degrees use a ratio. Here the top degree is bigger.']]),
     haDrill(`S(x) = (−6x + 1)/(2x − 9)`, 'y = −3', 'Both degrees are 1, so divide the leading coefficients: −6 ÷ 2 = −3.', [['y = 3', 'Keep the sign of the top leading coefficient, −6.'], ['y = 0', 'y = 0 needs a bigger bottom. Here both degrees are 1.'], ['No horizontal asymptote', 'Equal degrees always give a horizontal asymptote.']]),
     haDrill(`T(x) = (x + 7)/(x${E(3)} − 2)`, 'y = 0', 'The top has degree 1 and the bottom has degree 3. A bigger bottom pulls the ends toward y = 0.', [['y = 1', 'The ratio rule is only for equal degrees. Here 1 < 3.'], ['y = 7', '7 is the constant on top. Compare the degrees.'], ['No horizontal asymptote', 'That happens when the top is bigger. Here the bottom is bigger.']])],
     worked: 'R: top degree 3 > 2, no horizontal asymptote. S: equal degrees, −6 ÷ 2 = −3. T: top degree 1 < 3, y = 0.' } },

 { t: 'Slant asymptotes', ex: 'R(x) = <span class="frac"><span>x<sup>2</sup> − x + 3</span><span>x − 2</span></span>', level: 'solo',
   v: () => `<div class="m-split">${fP(x => (x * x - x + 3) / (x - 2), { xmin: -5, xmax: 9, ymin: -8, ymax: 14, vas: [2], slant: [1, 1], arrows: false, step: 2, labels: [{ x: 7, y: 8, t: 'y = x + 1', dx: -4, dy: -10, anchor: 'end' }], label: 'Graph with a slant asymptote y = x + 1 and a wall at x = 2' })}<div class="m-stack">${synthTable([1, -1, 3], 2)}${chips(['quotient x + 1, remainder 5', 'slant: <b>y = x + 1</b>'])}</div></div>`,
   x: `<p>When the top's degree is <span class="key">exactly one more</span> than the bottom's, the graph follows a slanted line far away: a <span class="key">slant (oblique) asymptote</span>.</p><p>Divide (synthetic division works for a divisor x − c). The quotient, without the remainder, is the slant line.</p>`,
   task: { kind: 'input', q: `R(x) = (x${E(2)} + 3x + 5)/(x + 1). Type the slant asymptote.`, ok: isPoly(['x+2', '2+x']), a: 'y = x + 2', ph: 'for example: y = x − 3',
     errs: [[isPoly(['x+4']), 'For (x + 1), the box number is −1, not 1.'], [r => /\//.test(r), 'Drop the remainder. The slant line is only the quotient.'], [isPoly(['x+3']), 'Run the division: bring down 1, multiply by −1, add to 3.']],
     hints: ['Synthetic division with −1 in the box and top row 1, 3, 5.', 'The bottom row is quotient | remainder. Use only the quotient.'],
     worked: 'With −1: bottom row 1, 2 | 3. Quotient x + 2, remainder 3. Slant asymptote: y = x + 2.' } }
]},
/* ------------------------------------------------ 3.5 ------------------------------------------------ */
{ id: '3.5', name: 'Track Repair', subtitle: 'Graph a rational function as one coherent process', icon: '🛠️', ride: 9, steps: [
 { t: 'The plan, then factor the top', ex: 'A(x) = <span class="frac"><span>x<sup>2</sup> − 2x − 3</span><span>x<sup>2</sup> − 1</span></span>', level: 'guided',
   v: () => `<div class="m-stack">${flow(['Factor top and bottom', 'Domain (original bottom)', 'Cancel: holes', 'Walls (vertical asymptotes)', 'Horizon (horizontal or slant)', 'Intercepts', 'Sketch'])}${eqChain([['x<sup>2</sup> − 2x − 3 = (x − 3)(x + 1)', 'numbers that multiply to −3 and add to −2']])}</div>`,
   cap: 'Teaching example A. Your practice uses function B.',
   x: `<p>Graphing a rational function is one process with seven moves. Each lesson step shows the move on example A, then you make the same move on a different function, <span class="key">B(x) = (2x<sup>2</sup> − 10x + 8)/(x<sup>2</sup> + x − 2)</span>.</p><p>Move 1 is to factor the top completely. Pull out a common number first if every term shares one.</p>`,
   rem: 'Factor out any common number, then find two numbers that multiply to the constant and add to the middle coefficient.',
   task: { kind: 'input', q: `Factor B's top: 2x${E(2)} − 10x + 8 = 2(x − 1)(x − __). Type the missing number.`, ok: isNum(4), a: '4',
     errs: [[isNum(-4), 'The blank already has a minus in front: (x − 4) needs the number 4.'], [isNum(5), 'Check: you need numbers that multiply to 4 and add to −5 after factoring out the 2.']],
     hints: ['2x<sup>2</sup> − 10x + 8 = 2(x<sup>2</sup> − 5x + 4).', 'Two numbers that multiply to 4 and add to −5.'], worked: '2(x<sup>2</sup> − 5x + 4) = 2(x − 1)(x − 4).' } },

 { t: 'Factor the bottom', ex: 'A(x) = <span class="frac"><span>x<sup>2</sup> − 2x − 3</span><span>x<sup>2</sup> − 1</span></span>', level: 'guided',
   v: () => eqChain([['x<sup>2</sup> − 1 = (x − 1)(x + 1)', 'difference of squares'], ['A(x) = (x − 3)(x + 1) / [(x − 1)(x + 1)]', 'factored']]),
   x: `<p>Factor the denominator completely too. Every factor you find will matter twice: once for the domain, and again for holes or walls.</p>`,

if (!S.studio || typeof S.studio !== 'object') S.studio = {};

const LEVEL_LABEL = { guided: 'Guided: reminder shown', faded: 'Less help: reminder on request', solo: 'On your own: hints only' };

function renderStudio() {
  const lesson = MISSIONS.find(m => m.id === studioId) || MISSIONS[0];
  if (studioStep >= lesson.steps.length) return renderMissionDone(lesson);
  const step = lesson.steps[studioStep], task = step.task, lvl = step.level || 'guided';
  const total = lesson.steps.length;
  const words = step.words ? `<dl class="m-words">${step.words.map(([w, d]) => `<div><dt>${w}</dt><dd>${d}</dd></div>`).join('')}</dl>` : '';
  const reminder = !step.rem || lvl === 'solo' ? '' : lvl === 'faded'
    ? `<details class="m-reminder"><summary>Show the method reminder</summary><p>${nbOps(step.rem)}</p></details>`
    : `<div class="m-reminder"><p class="m-rem-lab">Method reminder</p><p>${nbOps(step.rem)}</p></div>`;
  const hasHints = task.hints && task.hints.length;
  app.innerHTML = `<div class="wrap mission">
    <div class="lvl-head"><button class="back" id="studioHome">‹ All missions</button><p class="eyebrow">Section ${lesson.id} · ${lesson.name}</p></div>
    <div class="m-progress"><span class="cap">Step ${studioStep + 1} of ${total}</span><span class="m-level m-${lvl}">${LEVEL_LABEL[lvl]}</span></div>
    <div class="pips" aria-hidden="true">${lesson.steps.map((_, i) => `<span class="${i < studioStep ? 'done' : i === studioStep ? 'now' : ''}"></span>`).join('')}</div>
    <section class="m-card" aria-labelledby="mTitle">
      <h1 class="m-title" id="mTitle">${step.t}</h1>
      <figure class="m-figure">${step.ex ? `<div class="m-exhead"><span class="m-exlab">Example</span><span class="m-exeq">${keepF(step.ex)}</span></div>` : ''}${step.v ? step.v() : ''}${step.cap ? `<figcaption class="m-figcap">${step.cap}</figcaption>` : ''}</figure>
      <div class="m-explain">${nbOps(step.x)}</div>${words}
      <div class="m-try">
        <p class="m-try-lab">Your turn</p>
        <p class="m-q">${nbOps(task.q)}</p>
        <div id="mTask"></div>
        <div class="fb" id="mFb" aria-live="polite"></div>
        ${reminder}
        <div class="row m-help">${hasHints ? `<button class="btn ghost small" id="mHint">Give me a hint</button>` : ''}<button class="btn ghost small" id="mReveal">Show the worked solution</button></div>
        <div class="m-worked" id="mWorked" hidden></div>
      </div>
      <div class="row between m-nav"><button class="btn ghost" id="studioPrev" ${studioStep === 0 ? 'disabled' : ''}>Back</button><button class="btn" id="studioNext" disabled>${studioStep === total - 1 ? 'Finish mission' : 'Next step'}</button></div>
    </section></div>`;
  wireSteppers(app);
  const fbEl = document.getElementById('mFb'), worked = document.getElementById('mWorked'), nextBtn = document.getElementById('studioNext');
  const hintBtn = document.getElementById('mHint'), revealBtn = document.getElementById('mReveal');
  document.getElementById('studioHome').onclick = () => go({ screen: 'studioMap' });
  document.getElementById('studioPrev').onclick = () => { studioStep--; resetStep(); renderStudio(); };
  nextBtn.onclick = () => {
    studioStep++; resetStep();
    if (studioStep === total) { S.studio[studioId] = (S.studio[studioId] || 0) + 1; save(); }
    renderStudio();
    scrollTo({ top: 0, behavior: 'auto' });
  };
  let lockTask = () => {};
  const finish = (kind, msg) => {
    if (studioDone) return; studioDone = true;
    lockTask(); nextBtn.disabled = false; if (hintBtn) hintBtn.disabled = true; revealBtn.disabled = true;
    fb(fbEl, kind, msg);
    worked.hidden = false;
    worked.innerHTML = `<p class="m-rem-lab">${kind === 'ok' ? 'Why this works' : 'Worked solution'}</p><p>${task.worked}</p>`;
  };
  const api = {
    solved: msg => finish('ok', msg || (studioHints || studioErrors ? 'Correct. You worked it out.' : 'Correct, and on your own.')),
    wrong: msg => { studioErrors++; fb(fbEl, 'no', msg); },
    info: msg => fb(fbEl, 'info', msg),
    setLock: f => { lockTask = f; }
  };
  mountTask(document.getElementById('mTask'), task, api);
  if (hintBtn) hintBtn.onclick = () => {
    const i = Math.min(studioHints, task.hints.length - 1); studioHints++;
    fb(fbEl, 'info', `<b>Hint ${i + 1} of ${task.hints.length}.</b> ${task.hints[i]}`);
  };
  revealBtn.onclick = () => finish('info', 'Study each line, then redo it on paper. The next step uses new numbers.');
}
function resetStep() { studioHints = 0; studioErrors = 0; studioDone = false; }

function mountTask(host, task, api) {
  if (task.kind === 'input') {
    host.innerHTML = `<label class="cap" for="mAns">Your answer</label><div class="row m-inrow"><input id="mAns" class="num m-in" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${escA(task.ph || 'Type your answer')}"><button class="btn" id="mCheck">Check</button></div>`;
    const inp = host.querySelector('#mAns'), btn = host.querySelector('#mCheck');
    api.setLock(() => { inp.disabled = true; btn.disabled = true; });
    const check = () => {
      const raw = inp.value; if (!raw.trim()) { api.info('Type an answer first, or ask for a hint.'); return; }
      if (task.ok(raw)) return api.solved();
      const e = (task.errs || []).find(([t]) => { try { return t(raw); } catch (err) { return false; } });
      api.wrong(e ? e[1] : 'Not yet. Compare your work with the example above, step by step. You can try again.');
      inp.select();
    };
    btn.onclick = check; inp.onkeydown = e => { if (e.key === 'Enter') check(); };
    return;
  }
  if (task.kind === 'choice') {
    const opts = shuffle(task.opts);
    host.innerHTML = `<div class="choices ${task.wide ? 'm-wide' : ''}">${opts.map((o, i) => `<button class="choice" data-i="${i}">${o.h}</button>`).join('')}</div>`;
    const btns = [...host.querySelectorAll('.choice')];
    api.setLock(() => btns.forEach(b => (b.disabled = true)));
    btns.forEach(b => b.onclick = () => {
      const o = opts[+b.dataset.i];
      if (o.ok) { b.classList.add('right'); api.solved(o.why); }
      else { b.classList.add('wrong'); b.disabled = true; api.wrong(o.why); }
    });
    return;
  }
  if (task.kind === 'drills') {
    const items = task.items.map(it => ({ p: it.p, opts: it.fixed ? it.opts : shuffle(it.opts) }));
    host.innerHTML = `<div class="m-drills">${items.map((it, k) => `<div class="m-drill"><p class="m-drill-p"><span class="m-num">${k + 1}</span><span>${nbOps(it.p)}</span></p><div class="m-drill-opts">${it.opts.map((o, i) => `<button class="choice" data-k="${k}" data-i="${i}">${o.h}</button>`).join('')}</div><p class="m-drill-fb" aria-live="polite"></p></div>`).join('')}</div>`;
    const solved = items.map(() => false), all = [...host.querySelectorAll('.choice')];
    api.setLock(() => all.forEach(b => (b.disabled = true)));
    all.forEach(b => b.onclick = () => {
      const k = +b.dataset.k, o = items[k].opts[+b.dataset.i], out = b.closest('.m-drill').querySelector('.m-drill-fb');
      if (solved[k]) return;
      if (o.ok) {
        solved[k] = true; b.classList.add('right');
        b.closest('.m-drill').querySelectorAll('.choice').forEach(x => (x.disabled = true));
        out.className = 'm-drill-fb ok'; out.innerHTML = o.why;
        if (solved.every(Boolean)) api.solved(studioErrors ? 'All sorted. Review any card you missed.' : 'All sorted, and every one on the first try.');
      } else { studioErrors++; b.classList.add('wrong'); b.disabled = true; out.className = 'm-drill-fb no'; out.innerHTML = o.why; }
    });
    return;
  }
  if (task.kind === 'multi') {
    host.innerHTML = `<div class="m-multi">${task.fields.map((f, i) => `<label class="m-field"><span>${f.lab}</span><input class="num" data-f="${i}" autocomplete="off" spellcheck="false"><span class="m-mark" aria-live="polite"></span></label>`).join('')}</div><div class="row"><button class="btn" id="mCheck">Check all</button></div>`;
    const ins = [...host.querySelectorAll('input')], btn = host.querySelector('#mCheck');
    api.setLock(() => { ins.forEach(i => (i.disabled = true)); btn.disabled = true; task.fields.forEach((f, i) => { ins[i].value = ins[i].value || f.a.replace(/<[^>]+>/g, ''); }); });
    const check = () => {
      if (ins.some(i => !i.value.trim())) { api.info('Fill in every box first. Use paper for the work.'); return; }
      const msgs = [];
      task.fields.forEach((f, i) => {
        const ok = f.ok(ins[i].value), mark = ins[i].parentElement.querySelector('.m-mark');
        mark.textContent = ok ? '✓ correct' : '✗ check this';
        mark.className = 'm-mark ' + (ok ? 'ok' : 'no');
        if (!ok) { const e = (f.errs || []).find(([t]) => t(ins[i].value)); msgs.push(`<b>${f.lab}:</b> ${e ? e[1] : f.miss || 'Recheck this one.'}`); }
      });
      if (!msgs.length) api.solved(); else api.wrong(msgs.join('<br>'));
    };
    btn.onclick = check; ins.forEach(i => (i.onkeydown = e => { if (e.key === 'Enter') check(); }));
    return;
  }
  if (task.kind === 'sign') {
    const n = task.tests.length;
    const ivl = i => (i === 0 ? `x &lt; ${task.pts[0]}` : i === n - 1 ? `x &gt; ${task.pts[n - 2]}` : `${task.pts[i - 1]} &lt; x &lt; ${task.pts[i]}`);
    host.innerHTML = numberLine({ pts: task.pts.map(t => ({ t })), tests: task.tests.map(N), label: 'Number line split at ' + task.pts.join(' and ') }) +
      `<div class="m-signrows">${task.tests.map((t, i) => `<div class="m-signrow"><span class="m-sr-lab">${ivl(i)}<small>test x = ${N(t)}</small></span><span class="seg wide" role="group" aria-label="Sign for ${ivl(i).replace(/&[lg]t;/g, m => (m === '&lt;' ? '<' : '>'))}"><button data-i="${i}" data-s="+" aria-pressed="false">+ positive</button><button data-i="${i}" data-s="−" aria-pressed="false">− negative</button></span><span class="m-mark"></span></div>`).join('')}</div><div class="row"><button class="btn" id="mCheck">Check signs</button></div>`;
    const pick = Array(n).fill(null), btns = [...host.querySelectorAll('.seg button')], cbtn = host.querySelector('#mCheck');
    let tries = 0;
    api.setLock(() => { btns.forEach(b => (b.disabled = true)); cbtn.disabled = true; });
    btns.forEach(b => b.onclick = () => { const i = +b.dataset.i; pick[i] = b.dataset.s; b.parentElement.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); });
    cbtn.onclick = () => {
      if (pick.includes(null)) { api.info('Choose a sign for every interval first.'); return; }
      const bad = [];
      pick.forEach((p, i) => { const ok = (p === '+') === (task.ans[i] === '+'); const m = host.querySelectorAll('.m-signrow')[i].querySelector('.m-mark'); m.textContent = ok ? '✓' : '✗'; m.className = 'm-mark ' + (ok ? 'ok' : 'no'); if (!ok) bad.push(i); });
      if (!bad.length) return api.solved('Yes. Each test point settles the sign of its whole interval.');
      tries++;
      api.wrong(bad.map(i => tries < 2 ? `Recheck the interval ${ivl(i)}: find the sign of each factor at x = ${N(task.tests[i])}, then multiply the signs.` : `At x = ${N(task.tests[i])}: ${task.fx(task.tests[i])}. Work out each factor, then multiply.`).join('<br>'));
    };
    return;
  }
  if (task.kind === 'synth') {
    synthWidget(host, task.cs, task.c, 'mission', ({ misses }) => { studioErrors += misses; api.solved(misses ? 'Machine complete. Review the moves you corrected.' : 'Machine complete, with every move right the first time.'); });
    api.setLock(() => {});
    return;
  }
}

function renderMissionDone(lesson) {
  app.innerHTML = `<div class="wrap mission"><button class="back" id="studioHome">‹ All missions</button><section class="m-card win"><p class="eyebrow">Learning mission complete</p><h2>${lesson.icon} ${lesson.name}</h2><p>You worked through ${lesson.steps.length} steps. Completion is practice, not a grade.</p><div class="m-reminder"><p class="m-rem-lab">How this helps on a test</p><p>Try the next problem on paper first, with your calculator. If a step feels unfamiliar, come back to that step's example, then try a fresh problem in Solo Lab.</p></div><div class="row"><button class="btn" id="paper">Paper and calculator practice</button><button class="btn ghost" id="other">All missions</button><button class="btn ghost" id="repeat">Replay this mission</button></div></section></div>`;
  document.getElementById('studioHome').onclick = () => go({ screen: 'studioMap' });
  document.getElementById('other').onclick = () => go({ screen: 'studioMap' });
  document.getElementById('repeat').onclick = () => { studioStep = 0; resetStep(); go({ screen: 'studio' }); };
  document.getElementById('paper').onclick = () => { soloSection = ['3.4', '3.5'].includes(studioId) ? '3.4–3.5' : studioId; soloProblem = null; go({ screen: 'solo' }); };
}

function renderStudioMap() {
  app.innerHTML = `<div class="wrap mission"><div class="lvl-head"><button class="back" id="studioHome">‹ Route map</button><p class="eyebrow">MAT 150 · Chapter 3</p><h1>Learning Missions</h1><p class="muted">Each step shows a worked example, explains it, then gives you a different problem to try. Help fades as a mission goes on, so the last steps feel like working on paper.</p></div>
  <div class="m-maplist">${MISSIONS.map((m, i) => `<section class="m-card m-mapcard"><div class="row between"><p class="eyebrow">Section ${m.id} · ${m.steps.length} steps</p><span class="cap">${S.studio[m.id] ? 'Completed ' + S.studio[m.id] + '×' : 'Not finished yet'}</span></div><h2 class="m-maph">${m.icon} ${m.name}</h2><p class="muted">${m.subtitle}</p><div class="row"><button class="btn" data-start="${i}">${S.studio[m.id] ? 'Practice again' : 'Start learning'}</button><button class="btn ghost" data-ride="${i}">Matching ride</button></div></section>`).join('')}</div>
  <section class="m-card"><h2 class="m-maph">Paper and calculator practice</h2><p class="muted">Fresh problems with typed answers and no answer choices. Use hints only when you need them.</p><div class="row"><button class="btn ghost" id="studioSolo">Open Solo Lab</button></div></section></div>`;
  document.getElementById('studioHome').onclick = () => go({ screen: 'map' });
  document.getElementById('studioSolo').onclick = () => go({ screen: 'solo' });
  app.querySelectorAll('[data-start]').forEach(b => b.onclick = () => { studioId = MISSIONS[+b.dataset.start].id; studioStep = 0; resetStep(); go({ screen: 'studio' }); });
  app.querySelectorAll('[data-ride]').forEach(b => b.onclick = () => go({ screen: 'level', i: MISSIONS[+b.dataset.ride].ride, tab: 'learn' }));
}

while (S.stars.length < LEVELS.length) S.stars.push(0);
render();
</script>
